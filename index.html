<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONG - VIP Link Unlocker</title>
    
    <script src="https://mittengulped.com/99/28/b3/9928b3bb99a56121a5f38892687b2a9b.js"></script>

    <style>
        :root {
            --bg-color: #0b071e;
            --card-bg: #140f2b;
            --text-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.08);
            --input-bg: #0b071e;
            --accent-glow: #00f0ff;
        }

        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #222222;
            --border-color: rgba(0, 0, 0, 0.1);
            --input-bg: #f8f9fa;
            --accent-glow: #007bff;
        }

        body {
            margin: 0;
            padding: 20px 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 25px 20px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            position: relative;
            margin-bottom: 20px;
        }

        .top-icons {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 16px;
        }

        @keyframes pulseLogo {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
            50% { transform: scale(1.06); box-shadow: 0 0 25px rgba(255, 42, 133, 0.6); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
        }

        .logo-container {
            width: 95px;
            height: 95px;
            margin: 0 auto 12px auto;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--accent-glow);
            animation: pulseLogo 3s infinite ease-in-out;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            color: #ff2a85;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .updates-ticker {
            background: rgba(255, 42, 133, 0.1);
            border: 1px dashed #ff2a85;
            border-radius: 10px;
            padding: 8px;
            font-size: 12px;
            color: #ff2a85;
            margin-bottom: 15px;
        }

        .search-box {
            margin-bottom: 15px;
        }
        .search-box input {
            width: 100%;
            padding: 10px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            outline: none;
            font-size: 13px;
            box-sizing: border-box;
        }

        .btn-task {
            color: #ffffff;
            border: none;
            padding: 15px 20px;
            border-radius: 14px;
            width: 100%;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 14px;
            transition: 0.3s;
        }

        .btn-red {
            background: #ff2a4d;
            box-shadow: 0 5px 15px rgba(255, 42, 77, 0.35);
        }

        .btn-blue {
            background: #4169e1;
            box-shadow: 0 5px 15px rgba(65, 105, 225, 0.35);
        }

        .btn-task:hover {
            opacity: 0.92;
            transform: scale(1.01);
        }

        .btn-task:disabled {
            background: #444 !important;
            color: #888 !important;
            cursor: not-allowed;
            box-shadow: none;
        }

        .progress-container {
            margin: 20px 0 15px 0;
            text-align: right;
        }

        .progress-text {
            font-size: 13px;
            color: #888;
            margin-bottom: 6px;
        }

        .progress-bar {
            background: var(--input-bg);
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-fill {
            background: linear-gradient(90deg, #ff2a4d, #f39c12);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .btn-unlock {
            background: var(--input-bg);
            color: #777;
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            border-radius: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: not-allowed;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            text-align: center;
        }

        .btn-unlock.active {
            color: #fff;
            background: linear-gradient(135deg, #f39c12, #d35400);
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(243, 156, 18, 0.4);
        }

        .share-section {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .share-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .share-btn:hover {
            background: var(--accent-glow);
            color: #000;
        }

        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-msg {
            background: var(--card-bg);
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--accent-glow);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-size: 13px;
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .reviews-section {
            width: 90%;
            max-width: 380px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 15px;
            box-sizing: border-box;
            font-size: 13px;
        }
        .review-item {
            background: var(--input-bg);
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 8px;
            border-right: 3px solid #ff2a85;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="card">
        <div class="top-icons">
            <button class="icon-btn" onclick="toggleTheme()" title="تغيير الوضع">🌙</button>
            <button class="icon-btn" onclick="openAdmin()" title="الإعدادات">⚙️</button>
        </div>

        <div class="logo-container">
          <img src="https://i.postimg.cc/vBbhHw0m/lrgo.jpg" alt="Logo">
        </div>
        
        <div class="title-container">
            <span>👑</span>
            <h1>SONG</h1>
            <span>👑</span>
        </div>

        <div class="updates-ticker" id="updateTickerText">
            🚀 أحدث إضافة: تم تحديث سيرفر السكريبتات برابط مباشر جديد!
        </div>

        <div class="search-box">
            <input type="text" id="siteSearchInput" placeholder="🔍 ابحث هنا..." onkeyup="filterContent()">
        </div>
        
        <button class="btn-task btn-red" id="taskBtn0" onclick="startTask(0)">إعجاب بالفيديو 👍</button>
        <button class="btn-task btn-blue" id="taskBtn1" onclick="startTask(1)" disabled style="opacity: 0.5;">الانضمام لسيرفر الديسكورد 💬</button>
        <button class="btn-task btn-red" id="taskBtn2" onclick="startTask(2)" disabled style="opacity: 0.5;">الاشتراك في القناة 🔔</button>

        <div class="progress-container">
            <div class="progress-text" id="progText">0/3 التقدم</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progFill"></div>
            </div>
        </div>

        <button class="btn-unlock" id="unlockBtn" onclick="goNext()">🔒 الرابط مغلق</button>

        <div class="share-section">
            <button class="share-btn" onclick="shareWebsite()">🔗 مشاركة ودعوة أصدقائك</button>
            <button class="share-btn" onclick="copySiteLink()">📋 نسخ الرابط</button>
        </div>
    </div>

    <div class="reviews-section">
        <b>💬 آراء المستخدمين المميزين:</b>
        <div class="review-item"><b>أحمد:</b> "الموقع أسطوري وسريع جداً عاش!"</div>
        <div class="review-item"><b>محمود:</b> "شكراً على التحديثات والمصداقية العالية."</div>
    </div>

    <div id="toast-container"></div>

    <script>
        function showToast(message) {
            let container = document.getElementById('toast-container');
            let toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerHTML = `✨ ${message}`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = '0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2700);
        }

        function shareWebsite() {
            if (navigator.share) {
                navigator.share({
                    title: 'SONG - VIP Link Unlocker',
                    text: 'تفضل بزيارة الموقع واحصل على أحدث السكريبتات مجاناً!',
                    url: window.location.href,
                }).catch(() => {});
            } else {
                copySiteLink();
            }
        }

        function copySiteLink() {
            navigator.clipboard.writeText(window.location.href);
            showToast('تم نسخ رابط الموقع بنجاح! شاركه مع أصدقائك.');
        }

        function filterContent() {
            let query = document.getElementById('siteSearchInput').value.toLowerCase();
        }

        let waitingForReturn = false;
        let activeTaskIndex = null;

        let cfg = JSON.parse(localStorage.getItem('cfg')) || {
            l1: 'https://youtube.com',
            l2: 'https://discord.com',
            l3: 'https://youtube.com',
            updateText: '🚀 أحدث إضافة: تم تحديث سيرفر السكريبتات برابط مباشر جديد!',
            final: 'https://example.com'
        };

        let savedScript = localStorage.getItem('last_saved_script');
        if(savedScript) {
            cfg.final = savedScript;
        }

        if(cfg.updateText) {
            document.getElementById('updateTickerText').innerText = cfg.updateText;
        }

        let totalVisitors = parseInt(localStorage.getItem('site_visitors') || '0');
        if (!sessionStorage.getItem('visited_session')) {
            totalVisitors++;
            localStorage.setItem('site_visitors', totalVisitors);
            sessionStorage.setItem('visited_session', 'true');
        }

        function toggleTheme() {
            let body = document.body;
            let btn = document.querySelector('.top-icons .icon-btn');
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                btn.innerText = '☀️';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.innerText = '🌙';
            }
        }

        function startTask(i) {
            let links = [cfg.l1, cfg.l2, cfg.l3];
            activeTaskIndex = i;
            waitingForReturn = true;

            window.open(links[i], '_blank');

            let btn = document.getElementById('taskBtn' + i);
            btn.innerText = '⏳ أكمل المهمة وعد هنا...';
            btn.setAttribute('disabled', 'true');
        }

        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible' && waitingForReturn && activeTaskIndex !== null) {
                waitingForReturn = false;
                let i = activeTaskIndex;
                let btn = document.getElementById('taskBtn' + i);
                let seconds = 5;

                btn.innerText = `⏳ انتظر (${seconds} ثواني)...`;

                let timer = setInterval(() => {
                    seconds--;
                    if (seconds > 0) {
                        btn.innerText = `⏳ انتظر (${seconds} ثواني)...`;
                    } else {
                        clearInterval(timer);
                        btn.innerText = '✅ تم إتمام المهمة';
                        btn.style.background = '#2ecc71';

                        if (i + 1 < 3) {
                            let nextBtn = document.getElementById('taskBtn' + (i + 1));
                            nextBtn.removeAttribute('disabled');
                            nextBtn.style.opacity = '1';
                        }

                        let completedCount = i + 1;
                        document.getElementById('progText').innerText = completedCount + '/3 التقدم';
                        document.getElementById('progFill').style.width = (completedCount / 3) * 100 + '%';

                        if (completedCount === 3) {
                            let unlockBtn = document.getElementById('unlockBtn');
                            unlockBtn.classList.add('active');
                            unlockBtn.innerText = '🔓 الانتقال لصفحة التحميل';
                        }
                        activeTaskIndex = null;
                    }
                }, 1000);
            }
        });

        function goNext() {
            let activeCount = 0;
            for (let k = 0; k < 3; k++) {
                if (document.getElementById('taskBtn' + k).innerText.includes('✅')) activeCount++;
            }
            if (activeCount === 3) {
                const p = new URLSearchParams(location.search);
                const t = p.get('to');
                
                let targetUrl = 'ready.html';
                if (t) {
                    targetUrl += '?to=' + encodeURIComponent(t);
                } else {
                    localStorage.setItem('last_saved_script', cfg.final);
                }
                window.location.href = targetUrl;
            } else {
                showToast('يجب إتمام جميع المهام والانتظار بالترتيب أولاً!');
            }
        }

        function openAdmin() {
            window.location.href = 'admin.html';
        }
    </script>
</body>
        </html>
