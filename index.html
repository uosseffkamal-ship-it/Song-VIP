<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONG - VIP Link Unlocker</title>

    <!-- Supabase -->

    <!-- السكربت الأصلي -->

    <style>
        :root {
            --bg-color: #0b071e;
            --card-bg: #140f2b;
            --text-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.08);
            --input-bg: #0b071e;
            --accent-glow: #00f0ff;
        }

        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #222222;
            --border-color: rgba(0, 0, 0, 0.1);
            --input-bg: #f8f9fa;
            --accent-glow: #007bff;
        }

        body {
            margin: 0;
            padding: 20px 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 25px 20px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            position: relative;
            margin-bottom: 20px;
        }

        .top-icons {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 15px;
        }

        @keyframes pulseLogo {
            0% {
                transform: scale(1);
                box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            }

            50% {
                transform: scale(1.06);
                box-shadow: 0 0 25px rgba(255, 42, 133, 0.6);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            }
        }

        .logo-container {
            width: 95px;
            height: 95px;
            margin: 0 auto 12px auto;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--accent-glow);
            animation: pulseLogo 3s infinite ease-in-out;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            color: #ff2a85;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .updates-ticker {
            background: rgba(255, 42, 133, 0.1);
            border: 1px dashed #ff2a85;
            border-radius: 10px;
            padding: 8px;
            font-size: 12px;
            color: #ff2a85;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .search-box {
            margin-bottom: 15px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            outline: none;
            font-size: 13px;
            box-sizing: border-box;
        }

        .btn-task {
            color: #ffffff;
            border: none;
            padding: 15px 20px;
            border-radius: 14px;
            width: 100%;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 14px;
            transition: 0.3s;
        }

        .btn-red {
            background: #ff2a4d;
            box-shadow: 0 5px 15px rgba(255, 42, 77, 0.35);
        }

        .btn-blue {
            background: #4169e1;
            box-shadow: 0 5px 15px rgba(65, 105, 225, 0.35);
        }

        .btn-task:hover {
            opacity: 0.92;
            transform: scale(1.01);
        }

        .btn-task:disabled {
            background: #444 !important;
            color: #888 !important;
            cursor: not-allowed;
            box-shadow: none;
        }

        .progress-container {
            margin: 20px 0 15px 0;
            text-align: right;
        }

        .progress-text {
            font-size: 13px;
            color: #888;
            margin-bottom: 6px;
        }

        .progress-bar {
            background: var(--input-bg);
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-fill {
            background: linear-gradient(90deg, #ff2a4d, #f39c12);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .btn-unlock {
            background: var(--input-bg);
            color: #777;
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            border-radius: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: not-allowed;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            text-align: center;
        }

        .btn-unlock.active {
            color: #fff;
            background: linear-gradient(135deg, #f39c12, #d35400);
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(243, 156, 18, 0.4);
        }

        .share-section {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .share-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }

        .share-btn:hover {
            background: var(--accent-glow);
            color: #000;
        }

        /* =========================
           عداد الزوار
        ========================= */

        .visitor-stats {
            margin-top: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .visitor-stat {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 6px;
            text-align: center;
        }

        .visitor-stat-icon {
            display: block;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .visitor-stat-number {
            display: block;
            font-size: 17px;
            font-weight: bold;
            color: var(--accent-glow);
            direction: ltr;
        }

        .visitor-stat-label {
            display: block;
            font-size: 10px;
            color: #888;
            margin-top: 3px;
        }

        .visitor-loading {
            opacity: 0.6;
        }

        .support-section {
            width: 90%;
            max-width: 380px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 15px;
            box-sizing: border-box;
            font-size: 13px;
            text-align: right;
            margin-top: 15px;
        }

        .support-section input,
        .support-section textarea {
            width: 100%;
            padding: 10px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 12px;
            margin-top: 8px;
            outline: none;
            box-sizing: border-box;
        }

        .support-section textarea {
            height: 60px;
            resize: none;
        }

        .btn-submit-msg {
            width: 100%;
            padding: 10px;
            background: #2ecc71;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 13px;
        }

        .comments-list {
            margin-top: 12px;
            max-height: 120px;
            overflow-y: auto;
        }

        .comment-item {
            background: var(--input-bg);
            padding: 6px 10px;
            border-radius: 8px;
            margin-top: 6px;
            border-right: 3px solid #00f0ff;
            font-size: 11px;
        }

        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast-msg {
            background: var(--card-bg);
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--accent-glow);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            font-size: 13px;
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body data-theme="dark">

    <div class="card">

        <div class="top-icons">
            <button class="icon-btn" onclick="toggleTheme()" title="تغيير الوضع">🌙</button>
            <button class="icon-btn" onclick="location.href='updates.html'" title="سجل التحديثات">📜</button>
            <button class="icon-btn" onclick="openAdmin()" title="الإعدادات">⚙️</button>
        </div>

        <div class="logo-container">
            <img src="https://i.postimg.cc/vBbhHw0m/lrgo.jpg" alt="Logo">
        </div>

        <div class="title-container">
            <span>👑</span>
            <h1>SONG</h1>
            <span>👑</span>
        </div>

        <div class="updates-ticker"
             onclick="location.href='updates.html'"
             id="updateTickerText">
            🚀 أحدث إضافة: تم تحديث سيرفر السكريبتات برابط مباشر جديد!

        <div class="search-box">
            <input
                type="text"

        </div>

        <button

        <button

            disabled
            style="opacity: 0.5;">
            الانضمام لسيرفر الديسكورد 💬
        </button>

        <button
            class="btn-task btn-red"
            id="taskBtn2"
            onclick="startTask(2)"
            disabled
            style="opacity: 0.5;">
            الاشتراك في القناة 🔔
        </button>

        <div class="progress-container">
            <div class="progress-text" id="progText">
                0/3 التقدم
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progFill"></div>
            </div>
        </div>

        <button
            class="btn-unlock"
            id="unlockBtn"

            🔒 الرابط مغلق
        </button>

        <div class="share-section">
            <button class="share-btn" onclick="shareWebsite()">

        <!-- عداد الزوار -->
        <div class="visitor-stats">

            <div class="visitor-stat">
                <span class="visitor-stat-icon">👥</span>

                <span
                    class="visitor-stat-number visitor-loading"
                    id="visitorCount">
                    0
                </span>

                <span class="visitor-stat-label">

                </span>
            </div>

            <div class="visitor-stat">
                <span class="visitor-stat-icon">🔥</span>

                <span
                    class="visitor-stat-number visitor-loading"
                    id="visitCount">

    </div>

    <div class="support-section">

        <b>💬 لديك مشكلة أو اقتراح؟ اتركه هنا:</b>

        <input

        <textarea
            id="userMsgInput"
            placeholder="اكتب المشكلة أو الملاحظة هنا..."></textarea>

        <button
            class="btn-submit-msg"
            onclick="sendUserMessage()">
            إرسال التعليق
        </button>

        <div
            class="comments-list"
            id="commentsContainer">
        </div>

    </div>

    <div id="toast-container"></div>

    <script>

        /* ==========================================
           SUPABASE
        ========================================== */

        const SUPABASE_URL =
            'https://zbnbvfrgcggbtpotsnbj.supabase.co';

        const SUPABASE_PUBLISHABLE_KEY =
            'sb_publishable_XYHtTlssM3vtdaeLiJEpbQ_oxUBW1k4';

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* ==========================================
           عداد الزوار والفتح
        ========================================== */

        function getVisitorId() {

            let visitorId =
                localStorage.getItem('song_supabase_visitor_id');

            if (!visitorId) {

                if (
                    window.crypto &&
                    typeof window.crypto.randomUUID === 'function'
                ) {
                    visitorId =
                        window.crypto.randomUUID();
                } else {

                    visitorId =
                        'visitor-' +
                        Date.now() +
                        '-' +
                        Math.random()
                            .toString(36)
                            .substring(2, 12);
                }

                localStorage.setItem(
                    'song_supabase_visitor_id',
                    visitorId
                );
            }

            return visitorId;
        }


        function updateVisitorNumbers(data) {

            const visitorCount =
                document.getElementById('visitorCount');

            const visitCount =
                document.getElementById('visitCount');

            if (!visitorCount || !visitCount) return;

            visitorCount.textContent =
                Number(data.visitors || 0).toLocaleString('en-US');

            visitCount.textContent =
                Number(data.visits || 0).toLocaleString('en-US');

            visitorCount.classList.remove('visitor-loading');
            visitCount.classList.remove('visitor-loading');
        }


        async function registerVisitor() {

            try {

                const visitorId = getVisitorId();

                const { data, error } =
                    await supabaseClient.rpc(
                        'register_site_visit',
                        {
                            p_visitor_id: visitorId
                        }
                    );

                if (error) {
                    console.error(
                        'Supabase visitor error:',
                        error
                    );
                    return;
                }

                if (data) {
                    updateVisitorNumbers(data);
                }

            } catch (error) {

                console.error(
                    'Visitor counter error:',
                    error
                );
            }
        }


        /* تشغيل العداد */
        registerVisitor();


        /* ==========================================
           Toast
        ========================================== */

        function showToast(message) {

            let container =
                document.getElementById('toast-container');

            let toast =
                document.createElement('div');

            toast.className = 'toast-msg';

            toast.innerHTML =
                `✨ ${message}`;

            container.appendChild(toast);

            setTimeout(() => {

                toast.style.opacity = '0';
                toast.style.transition = '0.3s';

                setTimeout(() => {
                    toast.remove();
                }, 300);

            }, 2700);
        }


        /* ==========================================
           التعليقات
        ========================================== */

        function loadComments() {

            let savedComments =
                JSON.parse(
                    localStorage.getItem(
                        'site_user_comments'
                    )
                ) || [];

            let container =
                document.getElementById(
                    'commentsContainer'
                );

            container.innerHTML = '';

            if (savedComments.length === 0) {

                container.innerHTML =
                    '<div class="comment-item">لا توجد تعليقات حتى الآن، كن أول المشاركين!</div>';

                return;
            }

            savedComments.forEach(c => {

                let div =
                    document.createElement('div');

                div.className =
                    'comment-item';

                div.innerHTML =
                    `<b>${c.name}:</b> ${c.text}`;

                container.appendChild(div);
            });
        }


        function sendUserMessage() {

            let name =
                document
                    .getElementById('userNameInput')
                    .value
                    .trim();

            let text =
                document
                    .getElementById('userMsgInput')
                    .value
                    .trim();

            if (!name || !text) {

                showToast(
                    'يرجى كتابة الاسم والرسالة أولاً!'
                );

                return;
            }

            let savedComments =
    JSON.parse(
        localStorage.getItem('site_user_comments') || '[]'
    );

savedComments.unshift({
    name: name,
    text: text,
    date: new Date().toLocaleString('ar-EG')
});

if (savedComments.length > 15) {
    savedComments.pop();
}

localStorage.setItem(
    'site_user_comments',
    JSON.stringify(savedComments)
);

document.getElementById('userNameInput').value = '';
document.getElementById('userMsgInput').value = '';

renderComments();

showToast('تم إرسال رسالتك بنجاح ✅');
        }
