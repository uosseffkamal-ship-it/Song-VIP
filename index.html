<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>SONG - VIP Link Unlocker</title>

    <script src="https://mittengulped.com/99/28/b3/9928b3bb99a56121a5f38892687b2a9b.js"></script>

    <style>
        /* =========================================================
           SONG VIP - PREMIUM UI
           ========================================================= */

        :root {
            --bg: #05050a;
            --bg-2: #090812;
            --card: rgba(15, 15, 25, 0.88);
            --card-2: rgba(21, 21, 34, 0.94);

            --text: #ffffff;
            --muted: #999aaa;

            --primary: #8b5cf6;
            --primary-2: #6366f1;
            --cyan: #22d3ee;
            --gold: #f5c451;

            --success: #22c55e;
            --danger: #ef4444;

            --border: rgba(255,255,255,.09);
            --border-hover: rgba(139,92,246,.5);

            --input: rgba(0,0,0,.35);

            --shadow:
                0 25px 80px rgba(0,0,0,.55),
                0 0 60px rgba(99,102,241,.08);
        }

        [data-theme="light"] {
            --bg: #f3f4f8;
            --bg-2: #ffffff;
            --card: rgba(255,255,255,.92);
            --card-2: #ffffff;

            --text: #161622;
            --muted: #737482;

            --border: rgba(0,0,0,.09);
            --input: #f5f5f7;

            --shadow:
                0 20px 50px rgba(0,0,0,.12),
                0 0 40px rgba(99,102,241,.08);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 18px 0 40px;

            font-family:
                Arial,
                Tahoma,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(139,92,246,.20),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 100% 45%,
                    rgba(34,211,238,.07),
                    transparent 30%
                ),
                var(--bg);

            transition:
                background .35s ease,
                color .35s ease;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background:
                linear-gradient(
                    120deg,
                    transparent 0%,
                    rgba(139,92,246,.025) 50%,
                    transparent 100%
                );

            z-index: -1;
        }

        /* ================= TOP NAV ================= */

        .top-nav {
            width: 92%;
            max-width: 440px;

            min-height: 62px;

            margin: 0 auto 14px;

            padding: 8px 12px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border: 1px solid var(--border);
            border-radius: 22px;

            background: rgba(10,10,17,.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow: var(--shadow);
        }

        [data-theme="light"] .top-nav {
            background: rgba(255,255,255,.75);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;

            border-radius: 13px;

            object-fit: cover;

            border: 1px solid rgba(255,255,255,.16);

            box-shadow:
                0 0 20px rgba(139,92,246,.25);
        }

        .brand-name {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: .4px;
        }

        .brand-name span {
            color: var(--primary);
        }

        .nav-actions {
            display: flex;
            gap: 6px;
        }

        .nav-btn {
            width: 40px;
            height: 40px;

            border-radius: 13px;

            border: 1px solid var(--border);
            background: var(--input);

            color: var(--text);

            cursor: pointer;

            font-size: 17px;

            transition: .25s;
        }

        .nav-btn:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        /* ================= MAIN CARD ================= */

        .main-card {
            width: 92%;
            max-width: 440px;

            margin: auto;

            padding: 16px;

            border: 1px solid var(--border);
            border-radius: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(18,18,30,.94),
                    rgba(8,8,15,.94)
                );

            box-shadow: var(--shadow);

            overflow: hidden;

            position: relative;
        }

        [data-theme="light"] .main-card {
            background: var(--card);
        }

        .main-card::before {
            content: "";

            position: absolute;

            width: 250px;
            height: 250px;

            top: -150px;
            left: 50%;

            transform: translateX(-50%);

            background: rgba(139,92,246,.18);

            filter: blur(70px);

            pointer-events: none;
        }

        /* ================= HERO ================= */

        .hero {
            position: relative;
            z-index: 1;
        }

        .cover {
            width: 100%;
            height: 205px;

            border-radius: 22px;

            overflow: hidden;

            position: relative;

            border: 1px solid var(--border);

            background:
                linear-gradient(
                    135deg,
                    #171329,
                    #09090e
                );
        }

        .cover img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            filter: saturate(1.05) contrast(1.03);
        }

        .cover::after {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to top,
                    rgba(0,0,0,.72),
                    transparent 55%
                );
        }

        .cover-badge {
            position: absolute;

            z-index: 2;

            top: 12px;
            right: 12px;

            padding: 7px 11px;

            border-radius: 12px;

            background: rgba(0,0,0,.55);

            border: 1px solid rgba(255,255,255,.14);

            backdrop-filter: blur(10px);

            font-size: 11px;
            font-weight: bold;
        }

        /* ================= PROFILE ================= */

        .profile {
            margin-top: -42px;

            position: relative;
            z-index: 5;

            text-align: center;
        }

        .logo-container {
            width: 88px;
            height: 88px;

            margin: auto;

            padding: 3px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--cyan),
                    var(--gold)
                );

            box-shadow:
                0 0 30px rgba(139,92,246,.35);
        }

        .logo-container img {
            width: 100%;
            height: 100%;

            border-radius: 50%;

            object-fit: cover;

            border: 4px solid #0b0b12;
        }

        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            margin-top: 10px;
        }

        .crown {
            font-size: 18px;
        }

        h1 {
            margin: 0;

            font-size: 27px;

            font-weight: 900;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #b99aff,
                    #67e8f9
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .description {
            margin: 8px auto 0;

            max-width: 330px;

            color: var(--muted);

            font-size: 13px;

            line-height: 1.8;
        }

        /* ================= UPDATE ================= */

        .updates-ticker {
            margin-top: 18px;

            padding: 12px 14px;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    rgba(139,92,246,.12),
                    rgba(34,211,238,.05)
                );

            border: 1px dashed rgba(139,92,246,.45);

            color: #c9b9ff;

            font-size: 12px;

            cursor: pointer;

            transition: .25s;
        }

        .updates-ticker:hover {
            border-color: var(--primary);
        }

        /* ================= SEARCH ================= */

        .search-box {
            margin-top: 14px;
        }

        .search-box input {
            width: 100%;

            padding: 14px 16px;

            border-radius: 15px;

            border: 1px solid var(--border);

            background: var(--input);

            color: var(--text);

            outline: none;

            font-size: 13px;

            transition: .25s;
        }

        .search-box input:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 3px rgba(139,92,246,.10);
        }

        /* ================= STATS ================= */

        .stats {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 10px;

            margin: 14px 0;
        }

        .stat {
            padding: 13px;

            border-radius: 17px;

            border: 1px solid var(--border);

            background: rgba(255,255,255,.025);

            text-align: center;
        }

        .stat-icon {
            font-size: 17px;
        }

        .stat-value {
            display: block;

            margin-top: 4px;

            font-size: 17px;

            font-weight: 900;
        }

        .stat-label {
            display: block;

            margin-top: 2px;

            color: var(--muted);

            font-size: 10px;
        }

        /* ================= LANGUAGE ================= */

        .language-row {
            display: flex;
            justify-content: center;

            margin: 10px 0 17px;
        }

        .language-select {
            border: 1px solid var(--border);

            background: var(--input);

            color: var(--text);

            padding: 10px 15px;

            border-radius: 15px;

            outline: none;

            font-size: 12px;
        }

        /* ================= TASK BOX ================= */

        .tasks-box {
            margin-top: 5px;

            padding: 17px;

            border-radius: 22px;

            border: 1px solid var(--border);

            background:
                rgba(0,0,0,.18);
        }

        .tasks-title {
            margin: 0 0 15px;

            font-size: 17px;

            font-weight: 900;
        }

        .tasks-title span {
            color: var(--muted);

            font-size: 11px;

            font-weight: normal;
        }

        .btn-task {
            width: 100%;

            min-height: 56px;

            margin-bottom: 11px;

            border: 1px solid rgba(255,255,255,.08);

            border-radius: 15px;

            color: #fff;

            cursor: pointer;

            font-size: 14px;

            font-weight: 800;

            transition:
                transform .25s,
                box-shadow .25s,
                opacity .25s;

            position: relative;

            overflow: hidden;
        }

        .btn-task::after {
            content: "";

            position: absolute;

            width: 100px;
            height: 100px;

            top: -50px;
            left: -50px;

            background: rgba(255,255,255,.12);

            border-radius: 50%;

            filter: blur(10px);
        }

        .btn-task:hover:not(:disabled) {
            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(0,0,0,.25);
        }

        .btn-task:disabled {
            cursor: not-allowed;

            opacity: .38;

            filter: grayscale(.5);
        }

        .btn-red {
            background:
                linear-gradient(
                    135deg,
                    #e11d48,
                    #be123c
                );
        }

        .btn-blue {
            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #3730a3
                );
        }

        .btn-purple {
            background:
                linear-gradient(
                    135deg,
                    #9333ea,
                    #6d28d9
                );
        }

        .task-done {
            background:
                linear-gradient(
                    135deg,
                    #16a34a,
                    #15803d
                ) !important;

            opacity: 1 !important;
        }

        /* ================= PROGRESS ================= */

        .progress-container {
            margin: 20px 0 15px;
        }

        .progress-head {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 8px;
        }

        .progress-label {
            color: var(--muted);

            font-size: 12px;
        }

        .progress-number {
            font-size: 13px;

            font-weight: 900;
        }

        .progress-bar {
            width: 100%;
            height: 9px;

            border-radius: 99px;

            overflow: hidden;

            background: rgba(255,255,255,.07);

            border: 1px solid var(--border);
        }

        .progress-fill {
            width: 0%;

            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    var(--primary),
                    var(--cyan)
                );

            box-shadow:
                0 0 18px rgba(34,211,238,.3);

            transition: width .5s ease;
        }

        /* ================= UNLOCK ================= */

        .btn-unlock {
            width: 100%;

            min-height: 55px;

            border-radius: 16px;

            border: 1px solid var(--border);

            background:
                rgba(255,255,255,.035);

            color: #777;

            cursor: not-allowed;

            font-size: 15px;

            font-weight: 900;
        }

        .btn-unlock.active {
            color: #fff;

            cursor: pointer;

            border-color: transparent;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-2),
                    var(--cyan)
                );

            box-shadow:
                0 10px 30px rgba(99,102,241,.28);

            animation: unlockPulse 2s infinite;
        }

        @keyframes unlockPulse {
            0%,100% {
                box-shadow:
                    0 10px 30px rgba(99,102,241,.25);
            }

            50% {
                box-shadow:
                    0 10px 40px rgba(34,211,238,.35);
            }
        }

        /* ================= SHARE ================= */

        .share-section {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 9px;

            margin-top: 12px;
        }

        .share-btn {
            padding: 12px 8px;

            border-radius: 14px;

            border: 1px solid var(--border);

            background: var(--input);

            color: var(--text);

            cursor: pointer;

            font-size: 11px;

            transition: .25s;
        }

        .share-btn:hover {
            border-color: var(--primary);

            background:
                rgba(139,92,246,.10);
        }

        /* ================= SUPPORT ================= */

        .support-section {
            width: 92%;
            max-width: 440px;

            margin: 15px auto 0;

            padding: 18px;

            border-radius: 24px;

            border: 1px solid var(--border);

            background: var(--card);

            box-shadow: var(--shadow);
        }

        .support-title {
            margin-bottom: 12px;

            font-weight: 900;

            font-size: 15px;
        }

        .support-section input,
        .support-section textarea {
            width: 100%;

            margin-top: 9px;

            padding: 12px;

            border-radius: 13px;

            border: 1px solid var(--border);

            background: var(--input);

            color: var(--text);

            outline: none;

            font-size: 12px;

            font-family: inherit;

            transition: .25s;
        }

        .support-section textarea {
            height: 80px;

            resize: none;
        }

        .support-section input:focus,
        .support-section textarea:focus {
            border-color: var(--primary);
        }

        .btn-submit-msg {
            width: 100%;

            margin-top: 10px;

            padding: 12px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #16a34a,
                    #059669
                );

            color: #fff;

            font-weight: 900;

            cursor: pointer;
        }

        .comments-list {
            margin-top: 13px;

            max-height: 180px;

            overflow-y: auto;
        }

        .comment-item {
            padding: 10px;

            margin-top: 7px;

            border-radius: 11px;

            border-right: 3px solid var(--primary);

            background: var(--input);

            font-size: 11px;

            line-height: 1.6;
        }

        /* ================= TOAST ================= */

        #toast-container {
            position: fixed;

            left: 15px;
            right: 15px;

            bottom: 18px;

            z-index: 99999;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 8px;

            pointer-events: none;
        }

        .toast-msg {
            max-width: 380px;

            padding: 12px 17px;

            border-radius: 14px;

            background:
                rgba(17,17,25,.95);

            border: 1px solid rgba(139,92,246,.4);

            color: #fff;

            box-shadow:
                0 15px 40px rgba(0,0,0,.4);

            font-size: 12px;

            animation: toastIn .3s ease;

            backdrop-filter: blur(15px);
        }

        @keyframes toastIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ================           TASK SYSTEM
           ========================================================= */

        let waitingForReturn = false;
        let activeTaskIndex = null;

        function startTask(i) {

            const links = [
                cfg.l1,
                cfg.l2,
                cfg.l3
            ];

            activeTaskIndex = i;
            waitingForReturn = true;

            const btn = document.getElementById(
                'taskBtn' + i
            );

            btn.innerText =
                '⏳ أكمل المهمة ثم عد هنا...';

            btn.disabled = true;

            window.open(
                links[i],
                '_blank'
            );
        }


        /* =========================================================
           RETURN DETECTION
           ========================================================= */

        document.addEventListener(
            'visibilitychange',
            function () {

                if (
                    document.visibilityState === 'visible' &&
                    waitingForReturn &&
                    activeTaskIndex !== null
                ) {

                    waitingForReturn = false;

                    const i = activeTaskIndex;

                    const btn =
                        document.getElementById(
                            'taskBtn' + i
                        );

                    let seconds = 5;

                    btn.innerText =
                        `⏳ انتظر (${seconds} ثواني)...`;

                    const timer = setInterval(
                        () => {

                            seconds--;

                            if (seconds > 0) {

                                btn.innerText =
                                    `⏳ انتظر (${seconds} ثواني)...`;

                            } else {

                                clearInterval(timer);

                                btn.innerText =
                                    '✅ تم إتمام المهمة';

                                btn.classList.add(
                                    'task-done'
                                );

                                const next =
                                    i + 1;

                                if (next < 3) {

                                    const nextBtn =
                                        document.getElementById(
                                            'taskBtn' + next
                                        );

                                    nextBtn.disabled =
                                        false;
                                }

                                const completed =
                                    i + 1;

                                updateProgress(
                                    completed
                                );

                                if (completed === 3) {

                                    const unlockBtn =
                                        document.getElementById(
                                            'unlockBtn'
                                        );

                                    unlockBtn.classList.add(
                                        'active'
                                    );

                                    unlockBtn.innerText =
                                        '🔓 فتح الرابط الآن';

                                    showToast(
                                        'تم إكمال جميع المهام! 🎉'
                                    );
                                }

                                activeTaskIndex = null;
                            }

                        },
                        1000
                    );
                }

            }
        );


        /* =========================================================
           PROGRESS
           ========================================================= */

        function updateProgress(count) {

            document.getElementById(
                'progText'
            ).innerText =
                count + '/3';

            document.getElementById(
                'taskCounter'
            ).innerText =
                count + '/3';

            document.getElementById(
                'progFill'
            ).style.width =
                (count / 3 * 100) + '%';
        }


        /* =========================================================
           UNLOCK
           ========================================================= */

        function goNext() {

            let activeCount = 0;

            for (
                let k = 0;
                k < 3;
                k++
            ) {

                const btn =
                    document.getElementById(
                        'taskBtn' + k
                    );

                if (
                    btn.innerText.includes('✅')
                ) {

                    activeCount++;
                }
            }


            if (activeCount === 3) {

                let totalClicks =
                    parseInt(
                        localStorage.getItem(
                            'site_clicks'
                        ) || '0'
                    );

                totalClicks++;

                localStorage.setItem(
                    'site_clicks',
                    totalClicks
                );

                updateClicksUI();


                const currentToken =
                    localStorage.getItem(
                        'song_vip_active_token'
                    );


                if (currentToken) {

                    window.location.href =
                        'ready.html?to=' +
                        encodeURIComponent(
                            currentToken
                        );

                } else {

                    window.location.href =
                        'ready.html';
                }


            } else {

                showToast(
                    'يجب إتمام جميع المهام بالترتيب أولاً!'
                );
            }
        }


        /* =========================================================
           ADMIN
           ========================================================= */

        function openAdmin() {

            window.location.href =
                'admin.html';
        }


        /* =========================================================
           LOAD SAVED LANGUAGE
           ========================================================= */

        const savedLanguage =
            localStorage.getItem(
                'song_language'
            );


        if (savedLanguage) {

            document.getElementById(
                'languageSelect'
            ).value = savedLanguage;

            changeLanguage(
                savedLanguage
            );
        }


        /* =========================================================
           FINAL INITIALIZATION
           ========================================================= */

        updateClicksUI();
        loadComments();

    </script>

</body>
</html>
