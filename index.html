            const links = [

                cfg.l3

            waitingForReturn = true;

            const btn = document.getElementById(

            btn.disabled = true;

            window.open(

        /* =========================================================
           RETURN DETECTION

        document.addEventListener(
            'visibilitychange',
            function () {

                if (
                    document.visibilityState === 'visible' &&
                    waitingForReturn &&
                    activeTaskIndex !== null
                ) {

                    waitingForReturn = false;

                    const i = activeTaskIndex;

                    const btn =
                        document.getElementById(
                            'taskBtn' + i
                        );

                    let seconds = 5;

                    btn.innerText =
                        `⏳ انتظر (${seconds} ثواني)...`;

                    const timer = setInterval(
                        () => {

                            seconds--;

                            if (seconds > 0) {

                                btn.innerText =
                                    `⏳ انتظر (${seconds} ثواني)...`;

                            } else {

                                clearInterval(timer);

                                btn.innerText =
                                    '✅ تم إتمام المهمة';

                                btn.classList.add(
                                    'task-done'
                                );

                                const next =
                                    i + 1;

                                if (next < 3) {

                                    const nextBtn =
                                        document.getElementById(
                                            'taskBtn' + next
                                        );

                                    nextBtn.disabled =
                                        false;
                                }

                                const completed =
                                    i + 1;

                                updateProgress(
                                    completed
                                );

                                if (completed === 3) {

                                    const unlockBtn =
                                        document.getElementById(
                                            'unlockBtn'
                                        );

                                    unlockBtn.classList.add(
                                        'active'
                                    );

                                    showToast(
                                        'تم إكمال جميع المهام! 🎉'
                                    );
                                }

                                activeTaskIndex = null;
                            }

                        },
                        1000

                }

        );

            const toast =

            toast.className = 'toast-msg';

           THEME
           ========================================================= */

        function toggleTheme() {

            const body =
                document.body;

            const current =
                body.getAttribute(
                    'data-theme'
                );

            const next =
                current === 'light'
                    ? 'dark'
                    : 'light';

            body.setAttribute(
                'data-theme',
                next
            );

            localStorage.setItem(
                'song_theme',
                next
            );

            const btn =
                document.getElementById(
                    'themeBtn'
                );

            if (btn) {
                btn.innerText =
                    next === 'light'
                        ? '🌙'
                        : '☀️';
            }
        }


        function loadTheme() {

            const saved =
                localStorage.getItem(
                    'song_theme'
                ) || 'dark';

            document.body.setAttribute(
                'data-theme',
                saved
            );
        }


        /* =========================================================
           TASK SYSTEM
           ========================================================= */

        let waitingForReturn = false;
        let activeTaskIndex = null;
        let taskTimer = null;


        function startTask(index) {

            if (
                index < 0 ||
                index > 2
            ) {
                return;
            }

            const links = [
                cfg.l1,
                cfg.l2,
                cfg.l3
            ];

            const btn =
                document.getElementById(
                    'taskBtn' + index
                );

            if (!btn) return;

            activeTaskIndex = index;
            waitingForReturn = true;

            btn.disabled = true;

            btn.innerText =
                '⏳ أكمل المهمة ثم ارجع هنا...';

            window.open(
                links[index],
                '_blank'
            );
        }


        /* =========================================================
           DETECT RETURN
           ========================================================= */

        document.addEventListener(
            'visibilitychange',
            function () {

                if (
                    document.visibilityState !== 'visible'
                ) {
                    return;
                }

                if (
                    !waitingForReturn ||
                    activeTaskIndex === null
                ) {
                    return;
                }

                waitingForReturn = false;

                const index =
                    activeTaskIndex;

                const btn =
                    document.getElementById(
                        'taskBtn' + index
                    );

                if (!btn) return;

                let seconds = 5;

                btn.innerText =
                    `⏳ انتظر (${seconds})...`;

                if (taskTimer) {
                    clearInterval(taskTimer);
                }

                taskTimer =
                    setInterval(
                        function () {

                            seconds--;

                            if (seconds > 0) {

                                btn.innerText =
                                    `⏳ انتظر (${seconds})...`;

                                return;
                            }

                            clearInterval(
                                taskTimer
                            );

                            taskTimer = null;

                            btn.innerText =
                                '✅ تم إتمام المهمة';

                            btn.classList.add(
                                'task-done'
                            );

                            btn.disabled = true;

                            const nextIndex =
                                index + 1;

                            if (
                                nextIndex < 3
                            ) {

                                const nextBtn =
                                    document.getElementById(
                                        'taskBtn' +
                                        nextIndex
                                    );

                                if (nextBtn) {

                                    nextBtn.disabled =
                                        false;

                                    nextBtn.style.opacity =
                                        '1';

                                    nextBtn.style.filter =
                                        'none';
                                }
                            }

                            updateProgress(
                                index + 1
                            );

                            if (
                                index + 1 === 3
                            ) {

                                const unlock =
                                    document.getElementById(
                                        'unlockBtn'
                                    );

                                if (unlock) {

                                    unlock.classList.add(
                                        'active'
                                    );

                                    unlock.disabled =
                                        false;

                                    unlock.innerText =
                                        '🔓 فتح الرابط الآن';
                                }

                                showToast(
                                    'تم إكمال جميع المهام بنجاح 🎉'
                                );
                            }

                            activeTaskIndex =
                                null;

                        },
                        1000
                    );
            }
        );


        /* =========================================================
           PROGRESS
           ========================================================= */

        function updateProgress(count) {

            const text =
                document.getElementById(
                    'progText'
                );

            const fill =
                document.getElementById(
                    'progFill'
                );

            if (text) {

                text.innerText =
                    count + '/3 التقدم';
            }

            if (fill) {

                fill.style.width =
                    ((count / 3) * 100) + '%';
            }
        }


        /* =========================================================
           UNLOCK
           ========================================================= */

        function goNext() {

            let completed = 0;

            for (
                let i = 0;
                i < 3;
                i++
            ) {

                const btn =
                    document.getElementById(
                        'taskBtn' + i
                    );

                if (
                    btn &&
                    btn.innerText.includes('✅')
                ) {
                    completed++;
                }
            }


            if (completed !== 3) {

                showToast(
                    'يجب إتمام جميع المهام بالترتيب أولاً 🔒'
                );

                return;
            }


            let clicks =
                parseInt(
                    localStorage.getItem(
                        'site_clicks'
                    ) || '0'
                );

            clicks++;

            localStorage.setItem(
                'site_clicks',
                clicks
            );

            updateClicksUI();


            const token =
                localStorage.getItem(
                    'song_vip_active_token'
                );


            if (token) {

                window.location.href =
                    'ready.html?to=' +
                    encodeURIComponent(
                        token
                    );

            } else {

                window.location.href =
                    'ready.html';
            }
        }


        /* =========================================================
           SHARE
           ========================================================= */

        function shareWebsite() {

            const url =
                window.location.href;

            if (
                navigator.share
            ) {

                navigator.share({

                    title:
                        'SONG - VIP',

                    text:
                        '🔥 ادخل وشوف أحدث السكريبتات من SONG',

                    url: url

                }).catch(() => {});

            } else {

                copySiteLink();
            }
        }


        /* =========================================================
           COPY LINK
           ========================================================= */

        function copySiteLink() {

            const url =
                window.location.href;

            if (
                navigator.clipboard
            ) {

                navigator.clipboard
                    .writeText(url)
                    .then(() => {

                        showToast(
                            'تم نسخ رابط الموقع 📋'
                        );

                    })
                    .catch(() => {

                        showToast(
                            'تعذر نسخ الرابط'
                        );
                    });

            } else {

                showToast(
                    'المتصفح لا يدعم نسخ الرابط'
                );
            }
        }


        /* =========================================================
           SEARCH
           ========================================================= */

        function filterContent() {

            const input =
                document.getElementById(
                    'siteSearchInput'
                );

            if (!input) return;

            const query =
                input.value
                    .trim()
                    .toLowerCase();

            const buttons =
                document.querySelectorAll(
                    '.btn-task'
                );

            buttons.forEach(
                function (button) {

                    const text =
                        button.innerText
                            .toLowerCase();

                    if (
                        !query ||
                        text.includes(query)
                    ) {

                        button.style.display =
                            '';

                    } else {

                        button.style.display =
                            'none';
                    }
                }
            );
        }


        /* =========================================================
           SUPPORT COMMENTS
           ========================================================= */

        function loadComments() {

            const container =
                document.getElementById(
                    'commentsContainer'
                );

            if (!container) return;

            let comments;

            try {

                comments =
                    JSON.parse(
                        localStorage.getItem(
                            'site_user_comments'
                        )
                    ) || [];

            } catch {

                comments = [];
            }


            container.innerHTML = '';


            if (
                comments.length === 0
            ) {

                container.innerHTML =
                    '<div class="comment-item">لا توجد تعليقات حتى الآن، كن أول المشاركين! 💜</div>';

                return;
            }


            comments.forEach(
                function (comment) {

                    const div =
                        document.createElement(
                            'div'
                        );

                    div.className =
                        'comment-item';

                    const name =
                        document.createElement(
                            'b'
                        );

                    name.textContent =
                        comment.name + ':';

                    const text =
                        document.createTextNode(
                            ' ' +
                            comment.text
                        );

                    div.appendChild(name);
                    div.appendChild(text);

                    container.appendChild(
                        div
                    );
                }
            );
        }


        function sendUserMessage() {

            const nameInput =
                document.getElementById(
                    'userNameInput'
                );

            const msgInput =
                document.getElementById(
                    'userMsgInput'
                );

            if (
                !nameInput ||
                !msgInput
            ) {
                return;
            }

            const name =
                nameInput.value.trim();

            const text =
                msgInput.value.trim();


            if (
                !name ||
                !text
            ) {

                showToast(
                    'اكتب اسمك والرسالة أولاً ✍️'
                );

                return;
            }


            let comments;

            try {

                comments =
                    JSON.parse(
                        localStorage.getItem(
                            'site_user_comments'
                        )
                    ) || [];

            } catch {

                comments = [];
            }


            comments.unshift({

                name: name,

                text: text

            });


            if (
                comments.length > 15
            ) {

                comments =
                    comments.slice(
                        0,
                        15
                    );
            }


            localStorage.setItem(
                'site_user_comments',
                JSON.stringify(
                    comments
                )
            );


            nameInput.value = '';
            msgInput.value = '';


            loadComments();


            showToast(
                'تم إرسال تعليقك بنجاح 💜'
            );
        }


        /* =========================================================
           ADMIN
           ========================================================= */

        function openAdmin() {

            window.location.href =
                'admin.html';
        }


        /* =========================================================
           INITIALIZATION
           ========================================================= */

        document.addEventListener(
            'DOMContentLoaded',
            function () {

                loadTheme();

                loadComments();

                updateClicksUI();

                updateProgress(0);


                const unlock =
                    document.getElementById(
                        'unlockBtn'
                    );

                if (unlock) {
                    unlock.disabled = true;
                }


                /* أول مهمة فقط تكون متاحة */

                for (
                    let i = 0;
                    i < 3;
                    i++
                ) {

                    const btn =
                        document.getElementById(
                            'taskBtn' + i
                        );

                    if (!btn) continue;

                    if (i === 0) {

                        btn.disabled =
                            false;

                        btn.style.opacity =
                            '1';

                    } else {

                        btn.disabled =
                            true;

                        btn.style.opacity =
                            '.38';
                    }
                }
    }
</script>
