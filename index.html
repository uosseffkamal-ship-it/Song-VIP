<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#07050f">
    <meta name="description" content="SONG VIP - Secure Script Access">

    <title>SONG VIP • Access Center</title>

    <!-- Original Ad Script -->

    <style>

        /* =========================================================
           SONG VIP — PREMIUM DESIGN SYSTEM
        ========================================================= */

        :root {
            --bg: #05040a;
            --bg-2: #0b0717;

            --card: rgba(18, 13, 34, 0.82);
            --card-solid: #120d22;

            --border: rgba(255,255,255,0.08);
            --border-bright: rgba(139,92,246,0.35);

            --text: #ffffff;
            --muted: #9290a3;

            --purple: #8b5cf6;
            --purple-2: #6d28d9;

            --cyan: #22d3ee;
            --pink: #ff2a85;

            --green: #22c55e;
            --orange: #f59e0b;
            --red: #ef4444;

            --shadow:
                0 25px 80px rgba(0,0,0,0.45);

            --glow:
                0 0 35px rgba(139,92,246,0.18);

            --radius: 24px;
        }

        [data-theme="light"] {
            --bg: #eef1f8;
            --bg-2: #ffffff;

            --card: rgba(255,255,255,0.86);
            --card-solid: #ffffff;

            --border: rgba(0,0,0,0.08);
            --border-bright: rgba(109,40,217,0.25);

            --text: #17131f;
            --muted: #737080;

            --shadow:
                0 25px 70px rgba(50,40,80,0.15);

            --glow:
                0 0 35px rgba(109,40,217,0.12);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                "Segoe UI",
                Tahoma,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(139,92,246,0.16),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 25%,
                    rgba(34,211,238,0.10),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(255,42,133,0.10),
                    transparent 30%
                ),
                linear-gradient(
                    145deg,
                    var(--bg),
                    var(--bg-2)
                );

            overflow-x: hidden;
            transition:
                background 0.4s ease,
                color 0.4s ease;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                radial-gradient(
                    rgba(255,255,255,0.06) 1px,
                    transparent 1px
                );

            background-size: 35px 35px;
            opacity: 0.15;

            pointer-events: none;
            z-index: -5;
        }

        /* =========================================================
           BACKGROUND ORBS
        ========================================================= */

        .ambient {
            position: fixed;
            width: 300px;
            height: 300px;

            border-radius: 50%;

            filter: blur(70px);
            opacity: 0.14;

            pointer-events: none;
            z-index: -3;

            animation: floatOrb 12s ease-in-out infinite;
        }

        .orb-1 {
            top: -100px;
            right: -100px;
            background: var(--purple);
        }

        .orb-2 {
            bottom: -120px;
            left: -100px;
            background: var(--cyan);
            animation-delay: -5s;
        }

        .orb-3 {
            top: 45%;
            left: 45%;
            width: 180px;
            height: 180px;
            background: var(--pink);
            animation-delay: -8s;
        }

        @keyframes floatOrb {
            0%,100% {
                transform: translate3d(0,0,0) scale(1);
            }

            50% {
                transform: translate3d(25px,-25px,0) scale(1.08);
            }
        }

        /* =========================================================
           LOADING SCREEN
        ========================================================= */

        #loadingScreen {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    #160d2d,
                    #05040a 65%
                );

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            z-index: 99999;

            transition:
                opacity 0.5s ease,
                visibility 0.5s ease;
        }

        #loadingScreen.hide {
            opacity: 0;
            visibility: hidden;
        }

        .loader-logo {
            width: 90px;
            height: 90px;

            border-radius: 50%;
            overflow: hidden;

            border: 2px solid var(--purple);

            box-shadow:
                0 0 25px rgba(139,92,246,0.45),
                0 0 60px rgba(34,211,238,0.12);

            animation: loaderPulse 1.8s ease-in-out infinite;
        }

        .loader-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .loader-title {
            margin-top: 18px;

            font-size: 25px;
            font-weight: 900;

            letter-spacing: 4px;

            background:
                linear-gradient(
                    90deg,
                    var(--cyan),
                    var(--purple),
                    var(--pink)
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .loader-subtitle {
            color: var(--muted);
            font-size: 12px;
            margin-top: 7px;
        }

        .loader-line {
            width: 150px;
            height: 3px;

            background: rgba(255,255,255,0.08);

            border-radius: 99px;
            margin-top: 20px;

            overflow: hidden;
        }

        .loader-line span {
            display: block;
            width: 45%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    var(--cyan),
                    var(--purple),
                    var(--pink)
                );

            border-radius: inherit;

            animation: loaderMove 1.2s ease-in-out infinite;
        }

        @keyframes loaderPulse {
            0%,100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }
        }

        @keyframes loaderMove {
            0% {
                transform: translateX(220%);
            }

            100% {
                transform: translateX(-220%);
            }
        }

        /* =========================================================
           PAGE
        ========================================================= */

        .page {
            width: 100%;
            max-width: 560px;

            margin: 0 auto;

            padding:
                max(18px, env(safe-area-inset-top))
                15px
                max(35px, env(safe-area-inset-bottom));

            opacity: 0;
            transform: translateY(12px);

            transition:
                opacity 0.7s ease,
                transform 0.7s ease;
        }

        .page.ready {
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================================================
           TOP BAR
        ========================================================= */

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 15px;

            animation: fadeDown 0.7s ease both;
        }

        .brand-mini {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .brand-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 12px var(--green);

            animation: livePulse 1.8s infinite;
        }

        .brand-text {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .top-actions {
            display: flex;
            gap: 7px;
        }

        .round-btn {
            width: 38px;
            height: 38px;

            border-radius: 12px;

            border: 1px solid var(--border);

            background:
                rgba(255,255,255,0.04);

            color: var(--text);

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border 0.2s ease;
        }

        .round-btn:hover {
            transform: translateY(-2px);
            border-color: var(--border-bright);
            background: rgba(139,92,246,0.12);
        }

        .round-btn:active {
            transform: scale(0.94);
        }

        @keyframes livePulse {
            0%,100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.45;
                transform: scale(0.75);
            }
        }

        /* =========================================================
           HERO
        ========================================================= */

        .hero {
            position: relative;

            background:
                linear-gradient(
                    145deg,
                    rgba(25,17,48,0.9),
                    rgba(9,7,18,0.88)
                );

            border: 1px solid var(--border);

            border-radius: 30px;

            padding: 28px 20px 22px;

            box-shadow: var(--shadow), var(--glow);

            overflow: hidden;

            text-align: center;

            animation: fadeUp 0.7s 0.05s ease both;
        }

        [data-theme="light"] .hero {
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.95),
                    rgba(245,244,251,0.95)
                );
        }

        .hero::before {
            content: "";

            position: absolute;

            width: 240px;
            height: 240px;

            top: -130px;
            left: 50%;

            transform: translateX(-50%);

            background: var(--purple);

            filter: blur(85px);
            opacity: 0.16;

            pointer-events: none;
        }

        .logo-wrap {
            position: relative;

            width: 105px;
            height: 105px;

            margin: 0 auto 15px;

            border-radius: 50%;

            padding: 3px;

            background:
                conic-gradient(
                    from 0deg,
                    var(--cyan),
                    var(--purple),
                    var(--pink),
                    var(--cyan)
                );

            animation:
                logoRotate 8s linear infinite;
        }

        .logo-wrap::after {
            content: "";

            position: absolute;
            inset: -8px;

            border-radius: 50%;

            border: 1px solid rgba(139,92,246,0.2);

            animation:
                ringPulse 2.5s ease-in-out infinite;
        }

        .logo-inner {
            width: 100%;
            height: 100%;

            border-radius: 50%;

            overflow: hidden;

            background: var(--card-solid);

            animation:
                logoCounterRotate 8s linear infinite;
        }

        .logo-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes logoRotate {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes logoCounterRotate {
            to {
                transform: rotate(-360deg);
            }
        }

        @keyframes ringPulse {
            0%,100% {
                transform: scale(0.95);
                opacity: 0.2;
            }

            50% {
                transform: scale(1.08);
                opacity: 0.6;
            }
        }

        .vip-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            padding: 6px 11px;

            border-radius: 999px;

            background: rgba(139,92,246,0.1);

            border: 1px solid rgba(139,92,246,0.22);

            color: #c4b5fd;

            font-size: 10px;
            font-weight: 800;

            letter-spacing: 1.2px;

            margin-bottom: 10px;
        }

        .vip-label span {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 9px var(--green);
        }

        .hero h1 {
            margin: 0;

            font-size: 34px;
            font-weight: 1000;

            letter-spacing: 3px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #c4b5fd,
                    #67e8f9,
                    #ffffff
                );

            background-size: 220% auto;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation:
                textShine 5s linear infinite;
        }

        .hero-subtitle {
            margin: 8px 0 18px;

            color: var(--muted);

            font-size: 13px;
            line-height: 1.7;
        }

        @keyframes textShine {
            to {
                background-position: 220% center;
            }
        }

        /* =========================================================
           SYSTEM STATUS
        ========================================================= */

        .system-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            padding: 9px 12px;

            border-radius: 13px;

            background: rgba(34,197,94,0.07);

            border: 1px solid rgba(34,197,94,0.16);

            color: #86efac;

            font-size: 11px;

            margin-bottom: 12px;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 10px var(--green);
        }

        .system-status.warning {
            color: #fcd34d;
            background: rgba(245,158,11,0.07);
            border-color: rgba(245,158,11,0.2);
        }

        .system-status.warning .status-dot {
            background: var(--orange);
            box-shadow: 0 0 10px var(--orange);
        }

        /* =========================================================
           TOKEN CARD
        ========================================================= */

        .token-card {
            position: relative;

            display: flex;
            align-items: center;
            gap: 12px;

            padding: 13px;

            margin-bottom: 15px;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    rgba(34,211,238,0.07),
                    rgba(139,92,246,0.07)
                );

            border: 1px solid rgba(139,92,246,0.16);

            text-align: right;

            overflow: hidden;
        }

        .token-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 60%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.06),
                    transparent
                );

            animation: tokenShine 4s infinite;
        }

        @keyframes tokenShine {
            0% {
                left: -100%;
            }

            55%,100% {
                left: 150%;
            }
        }

        .token-icon {
            width: 42px;
            height: 42px;

            flex: 0 0 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background:
                rgba(139,92,246,0.13);

            border: 1px solid rgba(139,92,246,0.2);

            font-size: 18px;
        }

        .token-info {
            min-width: 0;
            flex: 1;
        }

        .token-title {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .token-value {
            font-family: monospace;
            font-size: 12px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            color: var(--text);
        }

        .token-status {
            padding: 6px 9px;

            border-radius: 9px;

            font-size: 9px;
            font-weight: 800;

            color: #86efac;

            background: rgba(34,197,94,0.09);

            border: 1px solid rgba(34,197,94,0.15);
        }

        .token-status.missing {
            color: #fcd34d;
            background: rgba(245,158,11,0.08);
            border-color: rgba(245,158,11,0.15);
        }

        /* =========================================================
           NOTICE
        ========================================================= */

        .notice {
            display: flex;
            align-items: flex-start;
            gap: 9px;

            text-align: right;

            padding: 12px;

            margin-bottom: 17px;

            border-radius: 14px;

            background:
                rgba(255,255,255,0.025);

            border: 1px solid var(--border);

            color: var(--muted);

            font-size: 11px;
            line-height: 1.7;
        }

        .notice strong {
            color: var(--text);
        }

        /* =========================================================
           SECTION TITLE
        ========================================================= */

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin: 0 2px 10px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 900;
        }

        .section-small {
            font-size: 10px;
            color: var(--muted);
        }

        /* =========================================================
           TASKS
        ========================================================= */

        .tasks {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* =========================================
   TASK CARD
========================================= */

.task-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: linear-gradient(
        135deg,
        rgba(255,255,255,.045),
        rgba(255,255,255,.015)
    );
    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease;
    overflow: hidden;
}

.task-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(139,92,246,.08),
        transparent
    );
    transform: translateX(-100%);
    transition: transform .6s ease;
}

.task-card:hover::before {
    transform: translateX(100%);
}

.task-card:hover {
    transform: translateY(-2px);
    border-color: rgba(139,92,246,.45);
    box-shadow: 0 10px 30px rgba(0,0,0,.22);
}

.task-number {
    min-width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(139,92,246,.12);
    border: 1px solid rgba(139,92,246,.25);
    color: #a78bfa;
    font-weight: 900;
}

.task-info {
    flex: 1;
    min-width: 0;
}

.task-title {
    font-size: 13px;
    font-weight: 900;
    margin-bottom: 4px;
}

.task-desc {
    font-size: 10px;
    color: var(--muted);
}

.task-status {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,.04);
    color: var(--muted);
    font-size: 14px;
}

.task-card.done {
    border-color: rgba(34,197,94,.35);
    background: rgba(34,197,94,.055);
}

.task-card.done .task-status {
    background: rgba(34,197,94,.15);
    color: #22c55e;
}

.task-card.active {
    border-color: rgba(139,92,246,.55);
    box-shadow:
        0 0 0 1px rgba(139,92,246,.08),
        0 10px 30px rgba(139,92,246,.12);
}


/* =========================================
   PROGRESS
========================================= */

.progress-box {
    margin-top: 18px;
    padding: 14px;
    border-radius: 16px;
    background: rgba(255,255,255,.025);
    border: 1px solid var(--border);
}

.progress-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 9px;
}

.progress-label {
    font-size: 11px;
    color: var(--muted);
}

.progress-value {
    font-size: 12px;
    font-weight: 900;
    color: #a78bfa;
}

.progress-track {
    width: 100%;
    height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,.06);
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(
        90deg,
        #8b5cf6,
        #06b6d4,
        #22c55e
    );
    box-shadow: 0 0 15px rgba(139,92,246,.35);
    transition: width .5s cubic-bezier(.22,1,.36,1);
}


/* =========================================
   MAIN ACTION BUTTON
========================================= */

.main-action {
    position: relative;
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border: 0;
    border-radius: 15px;
    color: #fff;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
    background: linear-gradient(
        135deg,
        #8b5cf6,
        #6366f1
    );
    box-shadow:
        0 8px 25px rgba(99,102,241,.25);
    transition:
        transform .25s ease,
        box-shadow .25s ease,
        opacity .25s ease;
}

.main-action:hover {
    transform: translateY(-2px);
    box-shadow:
        0 12px 30px rgba(99,102,241,.35);
}

.main-action:active {
    transform: scale(.98);
}

.main-action:disabled {
    opacity: .45;
    cursor: not-allowed;
    box-shadow: none;
}


/* =========================================
   SECURITY STATUS
========================================= */

.security-card {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    padding: 11px 13px;
    border-radius: 14px;
    background: rgba(34,197,94,.055);
    border: 1px solid rgba(34,197,94,.18);
}

.security-icon {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(34,197,94,.12);
    color: #22c55e;
}

.security-info {
    flex: 1;
}

.security-title {
    font-size: 11px;
    font-weight: 900;
}

.security-text {
    font-size: 9px;
    color: var(--muted);
    margin-top: 3px;
}


/* =========================================
   QUICK INFO
========================================= */

.quick-info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 12px;
}

.info-item {
    text-align: center;
    padding: 10px 5px;
    border-radius: 13px;
    background: rgba(255,255,255,.025);
    border: 1px solid var(--border);
}

.info-icon {
    display: block;
    font-size: 15px;
    margin-bottom: 4px;
}

.info-value {
    display: block;
    font-size: 11px;
    font-weight: 900;
}

.info-label {
    display: block;
    font-size: 8px;
    color: var(--muted);
    margin-top: 3px;
}


/* =========================================
   FOOTER
========================================= */

.site-footer {
    margin-top: 18px;
    text-align: center;
    color: var(--muted);
    font-size: 9px;
    line-height: 1.8;
}

.site-footer strong {
    color: #a78bfa;
}


/* =========================================
   ANIMATIONS
========================================= */

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes glowPulse {
    0%,
    100% {
        box-shadow: 0 0 0 rgba(139,92,246,0);
    }

    50% {
        box-shadow:
            0 0 25px rgba(139,92,246,.18);
    }
}

.fade-up {
    animation: fadeUp .6s ease both;
}

.glow-animation {
    animation: glowPulse 2.5s ease-in-out infinite;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 480px) {

    .dashboard {
        width: 100%;
        padding: 12px;
    }

    .section-head {
        margin: 0 0 10px;
    }

    .section-title {
        font-size: 13px;
    }

    .task-card {
        padding: 12px;
        border-radius: 14px;
    }

    .task-number {
        min-width: 34px;
        height: 34px;
    }

    .task-title {
        font-size: 12px;
    }

    .task-desc {
        font-size: 9px;
    }

    .quick-info {
        gap: 6px;
    }

    .info-item {
        padding: 9px 4px;
    }

    .main-action {
        padding: 13px;
    }
}


/* =========================================
   REDUCED MOTION
========================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
    }

</head>
