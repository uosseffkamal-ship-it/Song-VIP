<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONG - جاهز للتحميل</title>

    <script src="https://mittengulped.com/99/28/b3/9928b3bb99a56121a5f38892687b2a9b.js"></script>

    <style>
        :root {
            --bg-color: #0b071e;
            --card-bg: #140f2b;
            --text-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.08);
            --input-bg: #0b071e;
        }
        body {
            margin: 0; padding: 20px 0; background-color: var(--bg-color); color: var(--text-color);
            font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
        }
        .card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px;
            padding: 25px 20px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }
        h2 { color: #2ecc71; font-size: 20px; margin-top: 0; }
        p { font-size: 13px; color: #ccc; line-height: 1.5; }
        .script-box {
            background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 12px; font-family: monospace; font-size: 12px; color: #00f0ff; word-break: break-all;
            max-height: 100px; overflow-y: auto; text-align: left; direction: ltr; margin: 15px 0;
        }
        .btn-copy {
            background: #2ecc71; color: #fff; border: none; padding: 14px; border-radius: 14px;
            width: 100%; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
        }
        .back-home { display: block; margin-top: 15px; color: #888; font-size: 12px; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎉 مبروك، لقد أكملت الشروط!</h2>
        <p>الخطوة الأخيرة جاهزة الآن، اضغط أدناه لنسخ السكريبت الخاص بك.</p>

        <div class="script-box" id="scriptDisplay">جاري جلب السكريبت...</div>

        <button class="btn-copy" onclick="copyScript()">📋 نسخ السكريبت</button>
        <a href="index.html" class="back-home">⬅ العودة للصفحة الرئيسية</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let scriptData = urlParams.get('to');
        let displayBox = document.getElementById('scriptDisplay');
        let finalScript = '';

        if (scriptData) {
            try {
                // فك تشفير السكريبت المرفق مباشرة داخل الرابط
                finalScript = decodeURIComponent(atob(scriptData));
            } catch (e) {
                finalScript = scriptData; // لو النص مش مشفر
            }
        }

        // لو مافيش في الرابط، جرب الـ localStorage كاحتياطي
        if (!finalScript) {
            finalScript = localStorage.getItem('last_saved_script');
        }

        if (finalScript) {
            displayBox.innerText = finalScript;
        } else {
            displayBox.innerText = "عذراً، لم يتم العثور على السكريبت المطلوب.";
            displayBox.style.color = "#ff2a4d";
        }

        function copyScript() {
            if (!finalScript) {
                alert('لا يوجد سكريبت للنسخ!');
                return;
            }
            navigator.clipboard.writeText(finalScript).then(() => {
                alert('تم النسخ بنجاح! 📋');
            });
        }
    </script>
</body>
</html>
