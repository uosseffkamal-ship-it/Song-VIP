<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONG - Ready</title>
    <style>
        :root {
            --bg-color: #0b071e;
            --card-bg: #140f2b;
            --text-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            padding: 20px 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 20px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .steps-indicators {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .step-dot {
            width: 35px;
            height: 6px;
            background: #333;
            border-radius: 3px;
            transition: 0.3s;
        }

        .step-dot.active {
            background: #f39c12;
        }

        .step-dot.completed {
            background: #2ecc71;
        }

        .banner-box {
            width: 100%;
            height: 250px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .banner-box iframe {
            width: 300px !important;
            height: 250px !important;
            border: none !important;
            background: transparent !important;
        }

        .content-body {
            margin-bottom: 20px;
        }

        .ad-title {
            font-size: 15px;
            color: #fff;
            margin: 0;
            line-height: 1.5;
        }

        .btn-continue {
            background: linear-gradient(135deg, #f39c12, #d35400);
            color: #ffffff;
            border: none;
            padding: 15px 20px;
            border-radius: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            box-shadow: 0 5px 20px rgba(243, 156, 18, 0.4);
            transition: 0.3s;
        }

        .btn-continue:hover {
            opacity: 0.9;
            transform: scale(1.01);
        }

        .brand-footer {
            margin-top: 15px;
            font-size: 11px;
            color: #666;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="steps-indicators">
            <div class="step-dot completed" id="dot0"></div>
            <div class="step-dot active" id="dot1"></div>
            <div class="step-dot" id="dot2"></div>
            <div class="step-dot" id="dot3"></div>
        </div>

        <div class="banner-box">
            <script type="text/javascript">
                atOptions = {
                    'key' : 'ec2c9d88b208d941a3545c1b4c621f00',
                    'format' : 'iframe',
                    'height' : 250,
                    'width' : 300,
                    'params' : {}
                };
            </script>
            <script type="text/javascript" src="//mittengulped.com/ec2c9d88b208d941a3545c1b4c621f00/invoke.js"></script>
        </div>

        <div class="content-body">
            <h2 class="ad-title" id="adTitleText">جاري تجهيز الرابط الخاص بك...</h2>
        </div>

        <button id="actionBtn" class="btn-continue" onclick="proceedNext()">
            ⏳ يرجى الانتظار (10)
        </button>

        <div class="brand-footer">SONG VIP - SECURE REDIRECT</div>
    </div>

    <script>
        let timeLeft = 10;
        let step = 1;

        const urlParams = new URLSearchParams(window.location.search);
        const linkToken = urlParams.get('to');
        
        // تم تحديث الرابط الاحتياطي ليكون صالحاً وآمناً
        let finalTarget = 'https://www.google.com';

        if (linkToken && localStorage.getItem(linkToken)) {
            finalTarget = localStorage.getItem(linkToken);
        } else if (linkToken) {
            finalTarget = decodeURIComponent(linkToken);
        }

        const adTitles = [
            "تكنولوجيا حديثة ومميزة لتغيير طريقك في البرمجة والتقنية اليوم.",
            "احصل على أفضل الأدوات والمميزات المخصصة لتطوير مواقعك بسرعة.",
            "الخطوة الأخيرة جاهزة الآن، اضغط أدناه للحصول على الرابط."
        ];

        const actionBtn = document.getElementById('actionBtn');
        const adTitleText = document.getElementById('adTitleText');

        let timer;

        function startTimer() {
            timeLeft = 10;
            if (actionBtn) {
                actionBtn.innerHTML = `⏳ يرجى الانتظار (${timeLeft})`;
                actionBtn.style.background = 'linear-gradient(135deg, #f39c12, #d35400)';
            }
            
            clearInterval(timer);
            timer = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    if (actionBtn) {
                        actionBtn.innerHTML = `⏳ يرجى الانتظار (${timeLeft})`;
                    }
                } else {
                    clearInterval(timer);
                    if (actionBtn) {
                        actionBtn.innerHTML = `✅ الخطوة جاهزة - متابعة`;
                        actionBtn.style.background = 'linear-gradient(135deg, #2ecc71, #27ae60)';
                    }
                }
            }, 1000);
        }

        // بدء العداد عند فتح الصفحة
        startTimer();

        function proceedNext() {
            if (timeLeft > 0) {
                alert('يرجى الانتظار حتى انتهاء العد التنازلي!');
                return;
            }

            if (step === 1) {
                step = 2;
                if (adTitleText) adTitleText.innerText = adTitles[1];
                document.getElementById('dot1').classList.remove('active');
                document.getElementById('dot1').classList.add('completed');
                document.getElementById('dot2').classList.add('active');
                startTimer();
            } else if (step === 2) {
                step = 3;
                if (adTitleText) adTitleText.innerText = adTitles[2];
                document.getElementById('dot2').classList.remove('active');
                document.getElementById('dot2').classList.add('completed');
                document.getElementById('dot3').classList.add('active');
                startTimer();
            } else if (step === 3) {
                window.open(finalTarget, '_blank');
            }
        }
    </script>
</body>
</html>
