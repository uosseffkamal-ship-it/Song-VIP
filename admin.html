<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONG VIP - لوحة التحكم المتقدمة</title>
    
    <script src="https://mittengulped.com/99/28/b3/9928b3bb99a56121a5f38892687b2a9b.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: #090514;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            background: linear-gradient(145deg, #130f2c, #0d0a1f);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 28px;
            padding: 25px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .header-title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #00f0ff;
            margin-bottom: 20px;
        }

        .stats-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
        }

        .stat-card h5 {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .stat-card span {
            font-size: 20px;
            font-weight: bold;
            color: #2ecc71;
        }

        .control-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .control-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #ff2a85;
            margin-bottom: 8px;
        }

        .control-group input[type="text"],
        .control-group textarea {
            width: 100%;
            padding: 12px;
            background: #070414;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #00f0ff;
            font-size: 13px;
            outline: none;
            box-sizing: border-box;
            direction: ltr;
            text-align: left;
        }

        .control-group textarea {
            height: 80px;
            resize: none;
            direction: rtl;
            text-align: right;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff2a85, #ff2a4d);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 42, 133, 0.4);
            transition: 0.3s;
            margin-bottom: 10px;
        }

        .btn-main:hover {
            opacity: 0.9;
            transform: scale(1.01);
        }

        .output-box {
            display: none;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(46, 204, 113, 0.3);
            border-radius: 12px;
            padding: 12px;
            margin-top: 15px;
            text-align: right;
        }

        .output-box input {
            width: 100%;
            padding: 10px;
            background: #070414;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #2ecc71;
            border-radius: 8px;
            font-size: 12px;
            direction: ltr;
            text-align: left;
            margin-bottom: 8px;
            outline: none;
        }

        .btn-copy-link {
            width: 100%;
            padding: 10px;
            background: #2ecc71;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }

        /* قسم الشكاوى الواردة داخل لوحة التحكم */
        .admin-messages-section {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 15px;
            text-align: right;
        }
        .admin-messages-section b {
            font-size: 13px;
            color: #00f0ff;
            display: block;
            margin-bottom: 10px;
        }
        .messages-list-box {
            max-height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg-card {
            background: #070414;
            padding: 8px 10px;
            border-radius: 8px;
            border-right: 3px solid #ff2a85;
            font-size: 12px;
        }
        .btn-clear-msgs {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .nav-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            color: #fff;
            transition: 0.3s;
        }

        .btn-home-link { background: #4169e1; }
        .btn-clear-data { background: #e74c3c; }

        .nav-btn:hover { opacity: 0.85; }

        #toast-box {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
        }
        .toast-notify {
            background: #140f2b;
            color: #fff;
            padding: 10px 18px;
            border-radius: 10px;
            border: 1px solid #00f0ff;
            font-size: 13px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2 class="header-title">🛠️ لوحة تحكم SONG VIP</h2>

        <div class="stats-row">
            <div class="stat-card">
                <h5>إجمالي الزيارات</h5>
                <span id="statVisits">0</span>
            </div>
            <div class="stat-card">
                <h5>إجمالي النقرات</h5>
                <span id="statClicks">0</span>
            </div>
        </div>

        <div class="control-group">
            <label>🔗 الرابط الخارجي المطلوب (أو السكربت):</label>
            <input type="text" id="targetLinkInput" placeholder="https://example.com أو رابط التحميل">
        </div>

        <div class="control-group">
            <label>💬 نص تحديث الشريط المتحرك (اختياري):</label>
            <textarea id="updateTextInput" placeholder="أحدث إضافة: تم تحديث السيرفر..."></textarea>
        </div>

        <button class="btn-main" onclick="generateUniqueLink()">✨ توليد رابط فريد ومختلف</button>

        <div class="output-box" id="outputContainer">
            <div style="font-size: 12px; color: #00f0ff; margin-bottom: 6px; text-align: center;" id="linkClickCountText">عدد مرات استخدام هذا الرابط: 0</div>
            <input type="text" id="resultLinkInput" readonly onclick="this.select()">
            <button class="btn-copy-link" id="copyBtn" onclick="copyGeneratedLink()">📋 نسخ الرابط الفريد</button>
        </div>

        <div class="admin-messages-section">
            <b>📥 شكاوى ومشاكل المستخدمين الواردة:</b>
            <div class="messages-list-box" id="adminMessagesList"></div>
            <button class="btn-clear-msgs" onclick="clearAllMessages()">🗑️ مسح جميع الرسائل</button>
        </div>

        <div class="nav-buttons">
            <button class="nav-btn btn-home-link" onclick="location.href='index.html'">🏠 العودة للموقع</button>
            <button class="nav-btn btn-clear-data" onclick="resetSiteStats()">🔄 تصفير الإحصائيات</button>
        </div>
    </div>

    <div id="toast-box"></div>

    <script>
        let generatedId = "";

        function showNotification(msg) {
            let box = document.getElementById('toast-box');
            box.innerHTML = `<div class="toast-notify">✨ ${msg}</div>`;
            setTimeout(() => { box.innerHTML = ''; }, 2500);
        }

        function generateUniqueLink() {
            let linkVal = document.getElementById('targetLinkInput').value.trim();
            let updateVal = document.getElementById('updateTextInput').value.trim();

            if (!linkVal) {
                showNotification('يرجى كتابة الرابط المطلوب أولاً!');
                return;
            }

            generatedId = 'link_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);

            // حفظ السكريبت بالمفتاح الفريد + حفظه كآخر سكريبت افتراضي دائم لضمان عدم حدوث خطأ العثور عليه من أي متصفح
            localStorage.setItem(generatedId, linkVal);
            localStorage.setItem(generatedId + '_clicks', '0');
            localStorage.setItem('last_saved_script', linkVal);

            if (updateVal) {
                let cfg = JSON.parse(localStorage.getItem('cfg')) || { l1: 'https://youtube.com', l2: 'https://discord.com', l3: 'https://youtube.com' };
                cfg.updateText = updateVal;
                localStorage.setItem('cfg', JSON.stringify(cfg));
            }

            let currentPath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
            let finalUrl = window.location.origin + currentPath + 'index.html?to=' + generatedId;

            document.getElementById('outputContainer').style.display = 'block';
            document.getElementById('resultLinkInput').value = finalUrl;
            document.getElementById('linkClickCountText').innerText = `عدد مرات استخدام هذا الرابط: 0`;

            showNotification('تم توليد الرابط الفريد بنجاح وحفظه كاحتياطي عام!');
        }

        function copyGeneratedLink() {
            let inputField = document.getElementById('resultLinkInput');
            inputField.select();
            navigator.clipboard.writeText(inputField.value);

            let btn = document.getElementById('copyBtn');
            btn.innerText = '✨ تم النسخ بنجاح!';
            showNotification('تم نسخ الرابط إلى الحافظة');
            setTimeout(() => { btn.innerText = '📋 نسخ الرابط الفريد'; }, 2000);
        }

        function loadAdminMessages() {
            let container = document.getElementById('adminMessagesList');
            let savedComments = JSON.parse(localStorage.getItem('site_user_comments')) || [];
            
            container.innerHTML = '';
            if(savedComments.length === 0) {
                container.innerHTML = '<div class="msg-card" style="color: #888;">لا توجد رسائل أو مشاكل مرسلة حالياً.</div>';
                return;
            }

            savedComments.forEach(c => {
                let div = document.createElement('div');
                div.className = 'msg-card';
                div.innerHTML = `<b>👤 ${c.name}:</b> ${c.text}`;
                container.appendChild(div);
            });
        }

        function clearAllMessages() {
            if(confirm('هل تريد مسح جميع رسائل وشكاوى المستخدمين؟')) {
                localStorage.removeItem('site_user_comments');
                loadAdminMessages();
                showNotification('تم مسح جميع الرسائل بنجاح');
            }
        }

        function refreshDashboardStats() {
            let visits = localStorage.getItem('site_visitors') || '0';
            let clicks = localStorage.getItem('site_clicks') || '0';

            document.getElementById('statVisits').innerText = visits;
            document.getElementById('statClicks').innerText = clicks;

            if (generatedId) {
                let specificClicks = localStorage.getItem(generatedId + '_clicks') || '0';
                document.getElementById('linkClickCountText').innerText = `عدد مرات استخدام هذا الرابط: ${specificClicks}`;
            }
        }

        function resetSiteStats() {
            if (confirm('هل أنت متأكد من تصفير كافة إحصائيات الموقع؟')) {
                localStorage.setItem('site_visitors', '0');
                localStorage.setItem('site_clicks', '0');
                refreshDashboardStats();
                showNotification('تم تصفير الإحصائيات بنجاح');
            }
        }

        refreshDashboardStats();
        loadAdminMessages();
        setInterval(refreshDashboardStats, 3000);
    </script>
</body>
</html>
