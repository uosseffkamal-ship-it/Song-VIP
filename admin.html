<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONG VIP - Admin Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: #070514;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .admin-card {
            background: rgba(18, 14, 36, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
            text-align: center;
        }

        .admin-title {
            font-size: 20px;
            font-weight: 900;
            color: #00f2fe;
            margin-bottom: 25px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px 10px;
            text-align: center;
        }

        .stat-box h4 {
            font-size: 13px;
            color: #b0a8d0;
            margin-bottom: 8px;
        }

        .stat-box span {
            font-size: 24px;
            font-weight: bold;
            color: #38ef7d;
        }

        .form-section {
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: right;
        }

        .form-section label {
            color: #fff;
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-section textarea {
            width: 100%;
            height: 110px;
            padding: 12px;
            border-radius: 10px;
            background: #0b071e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #2ecc71;
            box-sizing: border-box;
            outline: none;
            font-size: 13px;
            font-family: monospace;
            resize: none;
        }

        .btn-generate {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #f39c12, #d35400);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-generate:hover {
            opacity: 0.9;
        }

        .result-text {
            color: #2ecc71;
            font-size: 12px;
            margin-top: 10px;
            word-break: break-all;
            background: rgba(0,0,0,0.4);
            padding: 10px;
            border-radius: 8px;
            text-align: left;
            direction: ltr;
        }

        .btn-reset {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background: #ff4b5c;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-reset:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2 class="admin-title">🛠️ لوحة تحكم المسؤول (Admin)</h2>
        
        <div class="stats-grid">
            <div class="stat-box">
                <h4>إجمالي الزيارات</h4>
                <span id="adminTotalVisits">0</span>
            </div>
            <div class="stat-box">
                <h4>إجمالي النقرات</h4>
                <span id="adminTotalClicks">0</span>
            </div>
        </div>

        <div class="form-section">
            <label>📜 ضع سكربت الـ Lua هنا لتحويله لرابط:</label>
            <textarea id="scriptInput" placeholder='loadstring(game:HttpGet("https://..."))()'></textarea>
            
            <button type="button" class="btn-generate" onclick="generateScriptLink()">إنشاء الرابط الفريد للسكربت</button>
            <p id="generatedResult" class="result-text" style="display: none;"></p>
        </div>

        <button class="btn-reset" onclick="resetStats()">تصفير الإحصائيات 🔄</button>
    </div>

    <script>
        // دالة توليد الرابط الفريد من السكربت
        function generateScriptLink() {
            let scriptText = document.getElementById('scriptInput').value.trim();
            if(!scriptText) {
                alert('الرجاء كتابة أو لصق السكربت أولاً!');
                return;
            }

            // إنشاء كود تعريفي عشوائي فريد
            let uniqueId = 'song_' + Math.random().toString(36).substring(2, 8);
            
            // حفظ السكربت في الذاكرة المحلية للموقع
            localStorage.setItem(uniqueId, scriptText);

            // بناء الرابط النهائي الذي سيعطيك إياه لمشاركته
            let generatedReadyLink = window.location.origin + '/ready.html?to=' + uniqueId;
            
            let resultBox = document.getElementById('generatedResult');
            resultBox.style.display = 'block';
            resultBox.innerText = generatedReadyLink;
        }

        // جلب الإحصائيات
        function loadAdminStats() {
            let visits = localStorage.getItem('site_visits') || 1420;
            let clicks = localStorage.getItem('site_clicks') || 850;

            document.getElementById('adminTotalVisits').innerText = visits;
            document.getElementById('adminTotalClicks').innerText = clicks;
        }

        // تصفير الإحصائيات
        function resetStats() {
            if(confirm('هل أنت متأكد من تصفير الإحصائيات؟')) {
                localStorage.setItem('site_visits', 0);
                localStorage.setItem('site_clicks', 0);
                loadAdminStats();
            }
        }

        loadAdminStats();
    </script>

</body>
</html>
