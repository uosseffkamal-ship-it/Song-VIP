<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONG VIP - Admin Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: #070514;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .admin-card {
            background: rgba(18, 14, 36, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
            text-align: center;
        }

        .admin-title {
            font-size: 20px;
            font-weight: 900;
            color: #00f2fe;
            margin-bottom: 25px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px 10px;
            text-align: center;
        }

        .stat-box h4 {
            font-size: 13px;
            color: #b0a8d0;
            margin-bottom: 8px;
        }

        .stat-box span {
            font-size: 24px;
            font-weight: bold;
            color: #38ef7d;
        }

        .form-section {
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: right;
        }

        .form-section label {
            color: #fff;
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-section textarea {
            width: 100%;
            height: 110px;
            padding: 12px;
            border-radius: 10px;
            background: #0b071e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #2ecc71;
            box-sizing: border-box;
            outline: none;
            font-size: 13px;
            font-family: monospace;
            resize: none;
        }

        .btn-generate {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #f39c12, #d35400);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-generate:hover {
            opacity: 0.9;
        }

        .result-box {
            display: none;
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(46, 204, 113, 0.3);
            text-align: right;
        }

        .result-box input {
            width: 100%;
            padding: 8px;
            background: #0b071e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #2ecc71;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 8px;
            direction: ltr;
            text-align: left;
            outline: none;
        }

        .btn-copy {
            width: 100%;
            padding: 9px;
            background: #2ecc71;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
        }

        .btn-copy:hover {
            background: #27ae60;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-home {
            background: #4169e1;
        }

        .btn-reset {
            background: #ff4b5c;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        /* نظام التنبيهات المباشرة Toast */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
        }
        .toast-msg {
            background: #140f2b;
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #00f2fe;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2 class="admin-title">🛠️ لوحة تحكم المسؤول (Admin)</h2>
        
        <div class="stats-grid">
            <div class="stat-box">
                <h4>إجمالي الزيارات</h4>
                <span id="adminTotalVisits">0</span>
            </div>
            <div class="stat-box">
                <h4>إجمالي النقرات</h4>
                <span id="adminTotalClicks">0</span>
            </div>
        </div>

        <div class="form-section">
            <label>📜 ضع سكربت الـ Lua هنا لتحويله لرابط:</label>
            <textarea id="scriptInput" placeholder='loadstring(game:HttpGet("https://..."))()'></textarea>
            
            <button type="button" class="btn-generate" onclick="generateScriptLink()">إنشاء الرابط الفريد للسكربت</button>
            
            <div id="resultContainer" class="result-box">
                <input type="text" id="generatedResultInput" readonly onclick="this.select()">
                <button type="button" class="btn-copy" id="copyBtn" onclick="copyResultLink()">📋 نسخ الرابط</button>
            </div>
        </div>

        <div class="action-btns">
            <button class="btn-action btn-home" onclick="goHome()">🏠 الموقع</button>
            <button class="btn-action btn-reset" onclick="resetStats()">تصفير 🔄</button>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        function showToast(message) {
            let container = document.getElementById('toast-container');
            container.innerHTML = `<div class="toast-msg">✨ ${message}</div>`;
            setTimeout(() => { container.innerHTML = ''; }, 3000);
        }

        // توليد الرابط الفريد ليوجه المستخدم إلى index.html مع تضمين معرف السكربت
        function generateScriptLink() {
            let scriptText = document.getElementById('scriptInput').value.trim();
            if(!scriptText) {
                showToast('الرجاء كتابة أو لصق السكربت أولاً!');
                return;
            }

            let uniqueId = 'song_' + Math.random().toString(36).substring(2, 8);
            
            // تخزين السكربت برمز فريد في الذاكرة
            localStorage.setItem(uniqueId, scriptText);
            localStorage.setItem('last_saved_script', scriptText);

            let basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
            let generatedReadyLink = window.location.origin + basePath + 'index.html?to=' + uniqueId;
            
            let resultContainer = document.getElementById('resultContainer');
            let generatedResultInput = document.getElementById('generatedResultInput');
            
            resultContainer.style.display = 'block';
            generatedResultInput.value = generatedReadyLink;
            showToast('تم إنشاء الرابط الفريد بنجاح!');
        }

        function copyResultLink() {
            let copyInput = document.getElementById('generatedResultInput');
            copyInput.select();
            navigator.clipboard.writeText(copyInput.value);
            
            let copyBtn = document.getElementById('copyBtn');
            copyBtn.innerText = '✨ تم النسخ بنجاح!';
            showToast('تم نسخ الرابط إلى الحافظة');
            setTimeout(() => {
                copyBtn.innerText = '📋 نسخ الرابط';
            }, 2000);
        }

        function loadAdminStats() {
            let visits = localStorage.getItem('site_visitors') || 0;
            let clicks = localStorage.getItem('site_clicks') || 0;

            document.getElementById('adminTotalVisits').innerText = visits;
            document.getElementById('adminTotalClicks').innerText = clicks;
        }

        function resetStats() {
            if(confirm('هل أنت متأكد من تصفير الإحصائيات؟')) {
                localStorage.setItem('site_visitors', 0);
                localStorage.setItem('site_clicks', 0);
                loadAdminStats();
                showToast('تم تصفير الإحصائيات بنجاح');
            }
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        loadAdminStats();
    </script>

</body>
</html>
