<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SONG VIP - سجل التحديثات</title>

    <style>
        :root {
            --bg-color: #070510;
            --card-bg: rgba(20, 15, 43, 0.88);
            --card-bg-2: rgba(15, 10, 32, 0.95);
            --text-color: #ffffff;
            --muted: #a9a5b8;
            --border-color: rgba(255, 255, 255, 0.09);
            --input-bg: rgba(5, 5, 15, 0.72);

            --cyan: #00f0ff;
            --purple: #8b5cf6;
            --pink: #ff2a85;
            --green: #2ecc71;
            --orange: #f39c12;
        }

        [data-theme="light"] {
            --bg-color: #eef1f8;
            --card-bg: rgba(255, 255, 255, 0.92);
            --card-bg-2: #ffffff;
            --text-color: #181522;
            --muted: #666273;
            --border-color: rgba(0, 0, 0, 0.09);
            --input-bg: #f7f7fb;

            --cyan: #008fa3;
            --purple: #7048d8;
            --pink: #e51f72;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 25px 0 40px;

            min-height: 100vh;

            font-family:
                Arial,
                Tahoma,
                sans-serif;

            color: var(--text-color);

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(139, 92, 246, 0.16),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 15%,
                    rgba(0, 240, 255, 0.11),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(255, 42, 133, 0.10),
                    transparent 30%
                ),
                var(--bg-color);

            transition:
                background 0.3s,
                color 0.3s;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 90%
                );

            z-index: -1;
        }

        .container {
            width: min(92%, 520px);
            margin: auto;
        }

        /* =========================================
           الهيدر
        ========================================= */

        .header-box {
            position: relative;

            padding: 25px 18px 22px;

            margin-bottom: 20px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(24, 18, 56, 0.97),
                    rgba(10, 7, 25, 0.98)
                );

            border: 1px solid rgba(0, 240, 255, 0.22);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.42),
                inset 0 1px 0 rgba(255,255,255,0.05);

            overflow: hidden;

            text-align: center;
        }

        [data-theme="light"] .header-box {
            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #f4f1ff
                );
        }

        .header-box::before {
            content: "";

            position: absolute;

            top: 0;
            right: 0;

            width: 100%;
            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    var(--pink),
                    var(--purple),
                    var(--cyan)
                );
        }

        .header-box::after {
            content: "";

            position: absolute;

            width: 170px;
            height: 170px;

            left: -90px;
            bottom: -100px;

            border-radius: 50%;

            background: rgba(139,92,246,0.13);

            filter: blur(10px);
        }

        .header-content {
            position: relative;
            z-index: 2;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* الأيقونة */

        .header-icon-luxury {
            width: 76px;
            height: 76px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 23px;

            font-size: 35px;

            margin-bottom: 13px;

            background:
                linear-gradient(
                    135deg,
                    rgba(0,240,255,0.18),
                    rgba(139,92,246,0.20),
                    rgba(255,42,133,0.18)
                );

            border: 1px solid rgba(0,240,255,0.35);

            box-shadow:
                0 0 28px rgba(0,240,255,0.12),
                inset 0 0 20px rgba(255,255,255,0.025);

            animation:
                iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        /* الكلام تحت الأيقونة */

        .title-text-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-text-group h1 {
            margin: 0;

            font-size: 23px;

            font-weight: 900;

            letter-spacing: 1px;

            background:
                linear-gradient(
                    90deg,
                    var(--cyan),
                    #ffffff,
                    var(--pink)
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .subtitle-label {
            margin-top: 8px;

            font-size: 15px;

            font-weight: 900;

            color: var(--pink);

            letter-spacing: 0.8px;

            text-shadow:
                0 0 15px rgba(255,42,133,0.35);
        }

        .header-line {
            width: 80px;
            height: 2px;

            margin: 13px auto 0;

            border-radius: 50px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--cyan),
                    var(--pink),
                    transparent
                );
        }

        .header-description {
            margin: 13px 0 18px;

            color: var(--muted);

            font-size: 11px;

            line-height: 1.7;
        }

        /* أزرار الهيدر */

        .header-buttons {
            display: flex;
            gap: 8px;

            justify-content: center;
            flex-wrap: wrap;
        }

        .header-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 6px;

            padding: 9px 13px;

            border-radius: 11px;

            border: 1px solid var(--border-color);

            background: var(--input-bg);

            color: var(--text-color);

            text-decoration: none;

            font-size: 11px;

            cursor: pointer;

            transition: 0.25s;
        }

        .header-btn:hover {
            transform: translateY(-2px);

            border-color: var(--cyan);

            box-shadow:
                0 0 18px rgba(0,240,255,0.12);
        }

        .theme-btn:hover {
            border-color: var(--pink);
        }

        /* =========================================
           بطاقة آخر تحديث
        ========================================= */

        .latest-release {
            position: relative;

            margin-bottom: 20px;

            padding: 18px;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    rgba(139,92,246,0.16),
                    rgba(0,240,255,0.07),
                    rgba(255,42,133,0.08)
                );

            border: 1px solid rgba(139,92,246,0.3);

            overflow: hidden;
        }

        .latest-release::before {
            content: "";

            position: absolute;

            top: 0;
            right: 0;

            width: 4px;
            height: 100%;

            background:
                linear-gradient(
                    to bottom,
                    var(--cyan),
                    var(--purple),
                    var(--pink)
                );
        }

        .latest-top {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            margin-bottom: 10px;
        }

        .latest-label {
            color: var(--cyan);

            font-size: 10px;

            font-weight: 900;

            letter-spacing: 1px;
        }

        .version-badge {
            padding: 5px 9px;

            border-radius: 8px;

            background: rgba(255,42,133,0.13);

            color: var(--pink);

            border: 1px solid rgba(255,42,133,0.2);

            font-size: 10px;

            font-weight: 900;
        }

        .latest-title {
            margin: 0 0 8px;

            font-size: 17px;

            color: var(--text-color);

            font-weight: 900;
        }

        .latest-text {
            margin: 0;

            color: var(--muted);

            font-size: 12px;

            line-height: 1.8;
        }

        /* =========================================
           التقييم
        ========================================= */

        .rating-section {
            background: var(--card-bg);

            border: 1px solid var(--border-color);

            border-radius: 22px;

            padding: 18px;

            margin-bottom: 20px;

            box-shadow:
                0 12px 35px rgba(0,0,0,0.2);

            text-align: right;
        }

        .section-heading {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            margin-bottom: 13px;
        }

        .section-heading h3 {
            margin: 0;

            font-size: 14px;

            color: var(--cyan);
        }

        .section-heading span {
            font-size: 10px;

            color: var(--muted);
        }

        .stars-select {
            display: flex;

            gap: 5px;

            margin-bottom: 12px;

            direction: ltr;

            justify-content: flex-end;
        }

        .star {
            font-size: 22px;

            cursor: pointer;

            color: #555;

            transition:
                transform 0.15s,
                color 0.15s;
        }

        .star:hover {
            transform: scale(1.15);
        }

        .star.selected {
            color: #f39c12;

            text-shadow:
                0 0 10px rgba(243,156,18,0.35);
        }

        .rating-section input,
        .rating-section textarea {
            width: 100%;

            padding: 11px 12px;

            background: var(--input-bg);

            border: 1px solid var(--border-color);

            border-radius: 11px;

            color: var(--text-color);

            font-size: 12px;

            margin-bottom: 8px;

            outline: none;

            resize: none;

            transition: 0.2s;
        }

        .rating-section input:focus,
        .rating-section textarea:focus {
            border-color: var(--cyan);

            box-shadow:
                0 0 0 3px rgba(0,240,255,0.06);
        }

        .rating-section textarea {
            height: 65px;
        }

        .btn-submit-review {
            width: 100%;

            padding: 11px;

            background:
                linear-gradient(
                    135deg,
                    #2ecc71,
                    #27ae60
                );

            color: #fff;

            border: none;

            border-radius: 11px;

            font-weight: bold;

            cursor: pointer;

            font-size: 12px;

            transition: 0.2s;
        }

        .btn-submit-review:hover {
            transform: translateY(-1px);

            filter: brightness(1.08);
        }

        .reviews-container {
            margin-top: 12px;

            max-height: 180px;

            overflow-y: auto;
        }

        .review-item {
            background: var(--input-bg);

            padding: 10px 12px;

            border-radius: 11px;

            margin-top: 8px;

            border-right: 3px solid #f39c12;

            font-size: 11px;
        }

        .review-header-line {
            display: flex;

            justify-content: space-between;

            gap: 8px;

            font-weight: bold;

            color: var(--pink);

            margin-bottom: 4px;
        }

        .review-stars {
            color: #f39c12;
        }

        /* =========================================
           البحث
        ========================================= */

        .search-box {
            position: relative;

            margin-bottom: 12px;
        }

        .search-box input {
            width: 100%;

            padding: 13px 15px;

            background: var(--card-bg);

            border: 1px solid var(--border-color);

            border-radius: 14px;

            color: var(--text-color);

            outline: none;

            font-size: 12px;

            transition: 0.2s;
        }

        .search-box input:focus {
            border-color: var(--cyan);

            box-shadow:
                0 0 20px rgba(0,240,255,0.08);
        }

        /* =========================================
           التحديثات
        ========================================= */

        .update-card {
            position: relative;

            background: var(--card-bg);

            border: 1px solid var(--border-color);

            border-radius: 20px;

            padding: 18px;

            margin-bottom: 15px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.18);

            overflow: hidden;

            transition:
                transform 0.25s,
                border-color 0.25s,
                box-shadow 0.25s;
        }

        .update-card::before {
            content: "";

            position: absolute;

            right: 0;
            top: 0;

            width: 3px;
            height: 0;

            background:
                linear-gradient(
                    to bottom,
                    var(--cyan),
                    var(--pink)
                );

            transition: height 0.3s;
        }

        .update-card:hover {
            transform: translateY(-3px);

            border-color: rgba(0,240,255,0.22);

            box-shadow:
                0 16px 40px rgba(0,0,0,0.25);
        }

        .update-card:hover::before {
            height: 100%;
        }

        .update-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 6px;

            gap: 10px;
        }

        .update-title {
            font-weight: 900;

            font-size: 15px;

            color: var(--cyan);

            line-height: 1.5;
        }

        .update-date {
            font-size: 10px;

            color: var(--orange);

            font-weight: bold;

            margin-bottom: 11px;
        }

        .update-desc {
            font-size: 12px;

            line-height: 1.85;

            color: var(--muted);

            margin-bottom: 13px;
        }

        .update-desc b {
            color: var(--text-color);
        }

        .badge-new {
            background: rgba(255,42,133,0.13);

            color: var(--pink);

            padding: 4px 8px;

            border-radius: 7px;

            font-size: 9px;

            font-weight: bold;

            white-space: nowrap;

            border: 1px solid rgba(255,42,133,0.16);
        }

        .card-actions {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            font-size: 11px;

            border-top: 1px solid var(--border-color);

            padding-top: 10px;

            color: var(--muted);
        }

        .like-btn {
            background: var(--input-bg);

            border: 1px solid var(--border-color);

            color: var(--text-color);

            padding: 5px 10px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 11px;

            transition: 0.2s;
        }

        .like-btn:hover {
            background: rgba(255,42,133,0.12);

            border-color: var(--pink);

            color: var(--pink);
        }

        .like-btn.liked {
            background: rgba(255,42,133,0.12);

            border-color: var(--pink);

            color: var(--pink);

            cursor: default;
        }

        .empty-message {
            display: none;

            text-align: center;

            padding: 30px 15px;

            background: var(--card-bg);

            border: 1px solid var(--border-color);

            border-radius: 18px;

            color: var(--muted);

            font-size: 12px;
        }

        /* =========================================
           زر الرجوع للأعلى
        ========================================= */

        #topButton {
            position: fixed;

            left: 18px;
            bottom: 18px;

            width: 40px;
            height: 40px;

            border-radius: 13px;

            border: 1px solid var(--border-color);

            background: var(--card-bg-2);

            color: var(--cyan);

            cursor: pointer;

            display: none;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.3);

            z-index: 50;
        }

        /* =========================================
           Toast
        ========================================= */

        #toast-box {
            position: fixed;

            bottom: 20px;

            right: 20px;

            z-index: 9999;
        }

        .toast-notify {
            background:
                linear-gradient(
                    135deg,
                    #140f2b,
                    #0c0918
                );

            color: #fff;

            padding: 11px 16px;

            border-radius: 12px;

            border: 1px solid rgba(0,240,255,0.35);

            font-size: 12px;

            box-shadow:
                0 8px 30px rgba(0,0,0,0.45);

            animation:
                toastIn 0.25s ease;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================
           موبايل
        ========================================= */

        @media (max-width: 480px) {

            body {
                padding-top: 15px;
            }

            .container {
                width: 94%;
            }

            .header-box {
  border-radius: 23px;
  padding: 22px 14px 20px;
            }
                    .header-box {
            padding: 22px 14px 20px;
        }

        .header-icon {
            width: 72px;
            height: 72px;
            font-size: 34px;
        }

        .header-title {
            font-size: 25px;
        }

        .header-subtitle {
            font-size: 14px;
        }

        .header-desc {
            font-size: 12px;
            line-height: 1.8;
        }

        .top-actions {
            gap: 7px;
        }

        .top-btn {
            width: 42px;
            height: 42px;
            font-size: 17px;
        }

        .latest-release {
            padding: 18px 14px;
        }

        .latest-release h2 {
            font-size: 20px;
        }

        .latest-release p {
            font-size: 13px;
            line-height: 1.8;
        }

        .rating-box {
            padding: 18px 14px;
        }

        .rating-title {
            font-size: 18px;
        }

        .stars {
            gap: 4px;
        }

        .star {
            font-size: 25px;
        }

        .search-box {
            padding: 13px 14px;
            font-size: 13px;
        }

        .update-card {
            padding: 17px 14px;
            border-radius: 18px;
        }

        .update-card h3 {
            font-size: 17px;
        }

        .update-card p {
            font-size: 13px;
            line-height: 1.8;
        }

        .update-date {
            font-size: 11px;
        }

        .like-btn {
            padding: 8px 12px;
            font-size: 12px;
        }

        .review-item {
            padding: 12px;
        }

        .review-name {
            font-size: 13px;
        }

        .review-text {
            font-size: 12px;
            line-height: 1.7;
        }

        .comment-input,
        .name-input {
            font-size: 13px;
        }

        .submit-review {
            width: 100%;
            padding: 12px;
        }

        .back-to-top {
            width: 42px;
            height: 42px;
            bottom: 15px;
            left: 15px;
        }
    }

    /* ==========================================
       تحسين الشاشات الصغيرة جداً
       ========================================== */

    @media (max-width: 360px) {

        .container {
            width: 96%;
        }

        .header-title {
            font-size: 22px;
        }

        .header-subtitle {
            font-size: 13px;
        }

        .latest-release h2 {
            font-size: 18px;
        }

        .update-card h3 {
            font-size: 16px;
        }

        .star {
            font-size: 22px;
        }
    }
</style>

<script>
/* ==========================================
   تشغيل الصفحة
   ========================================== */

document.addEventListener("DOMContentLoaded", function () {

    // تحميل الثيم
    const savedTheme = localStorage.getItem("updates_theme");

    if (savedTheme === "light") {
        document.body.classList.add("light");
    }

    // تحميل التقييمات
    if (typeof loadRatings === "function") {
        loadRatings();
    }

    // تشغيل البحث
    const searchInput = document.getElementById("searchInput");

    if (searchInput && typeof filterUpdates === "function") {
        searchInput.addEventListener("input", filterUpdates);
    }

    // تشغيل أزرار اللايك
    document.querySelectorAll(".like-btn").forEach(function (button) {

        const version = button.dataset.version;

        if (!version) return;

        if (localStorage.getItem("liked_" + version) === "1") {
            button.classList.add("liked");
        }
    });

    // إظهار زر الرجوع للأعلى
    window.addEventListener("scroll", function () {

        const btn = document.getElementById("backToTop");

        if (!btn) return;

        if (window.scrollY > 400) {
            btn.classList.add("show");
        } else {
            btn.classList.remove("show");
        }
    });

});


/* ==========================================
   تغيير الثيم
   ========================================== */

function toggleTheme() {

    document.body.classList.toggle("light");

    const isLight = document.body.classList.contains("light");

    localStorage.setItem(
        "updates_theme",
        isLight ? "light" : "dark"
    );

    showToast(
        isLight
            ? "☀️ تم تفعيل الوضع الفاتح"
            : "🌙 تم تفعيل الوضع الداكن"
    );
}


/* ==========================================
   الرجوع لأعلى الصفحة
   ========================================== */

function scrollToTop() {

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* ==========================================
   رسالة Toast
   ========================================== */

function showToast(message) {

    let toast = document.getElementById("toast");

    if (!toast) {

        toast = document.createElement("div");

        toast.id = "toast";

        toast.style.position = "fixed";
        toast.style.bottom = "25px";
        toast.style.right = "50%";
        toast.style.transform = "translateX(50%)";
        toast.style.padding = "12px 18px";
        toast.style.borderRadius = "14px";
        toast.style.background = "rgba(20,20,30,.95)";
        toast.style.color = "#fff";
        toast.style.fontSize = "13px";
        toast.style.zIndex = "99999";
        toast.style.boxShadow = "0 10px 35px rgba(0,0,0,.35)";
        toast.style.border = "1px solid rgba(139,92,246,.35)";

        document.body.appendChild(toast);
    }

    toast.textContent = message;

    toast.style.opacity = "1";

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(function () {
        toast.style.opacity = "0";
    }, 2200);
}
</script>

</body>
